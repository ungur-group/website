- name: "Donghwan KIM"
  status: active
  image: "assets/people/donghwan.png"
  prose: "Donghwan joined the group first as a UROPS student and is now completing his FYP. His current research develops a machine-learning interatomic potential (MLIP) trained on Quantum ESPRESSO–based AIMD data to simulate iron oxidation reactions, with experience across DFT and classical MD. He came to computational chemistry through an earlier interest in magnetism, which still shapes how he thinks about electronic structure. Outside the lab, he follows baseball and plays a fair share of video games."
