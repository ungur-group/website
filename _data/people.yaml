- name: "Dr. Liviu UNGUR"
  status: active
  image: "assets/people/ungur.png"
  prose: "Liviu is the Principal Investigator (i.e. the boss). He obtained his B.Sc. in Chemistry at the State University of Moldova in 2005, and went on to pursue his studies at KU Leuven, Belgium, where he earned his Ph.D. in 2010 under the supervision of Professor L. F. Chibotaru. During his doctoral and postdoctoral research, he developed ab initio software for calculating the magnetic properties of molecules. He was awarded two prestigious three-year fellowships from the Flemish Science Foundation (FWO) in 2011 and 2014. From 2015 to 2016, he collaborated with Professor P.A. Malmqvist and Professor V. Veryazov at Lund University, Sweden focusing on the development of novel computational methods in the MOLCAS package. He joined NUS in June 2018 as a tenure track Assistant Professor. His current research focuses on the computational investigation of the electronic, optical and magnetic properties of molecular materials. More recently, his interest has expanded to include leveraging new machine learning and artificial intelligence techniques to enhance computational modelling, particularly in the areas of phonons and spin-phonon couplings."
  links:
    email: "chmlu@nus.edu.sg"
    scholar: "https://scholar.google.com/citations?user=Pn-zPAQAAAAJ&hl=en"
    orcid: "https://orcid.org/0000-0001-5015-4225"

- name: "Ran MO"
  status: active
  image: "assets/people/moran.png"
  prose: "Ran is a fourth-year PhD candidate, whose research interest is to train machine learning models to predict properties of complex crystalline chemical systems. His research lives at an intersection of computational chemistry, machine learning, and solid-state physics. When he gets his free time (or when the supercomputer servers go down), he spends many of his time in front of his piano or in a concert for classical music. He is quite into linguistics as well. If you have any trivia about languages, he will be more than happy to hear them!"
  links:
    email: "mo.ran@u.nus.edu"

- name: "Elusy, WEN Hanqi"
  status: active
  image: "assets/people/elusy.png"
  prose: "Elusy is currently a fourth-year Ph.D. student. Her research interests include spin–orbit coupling, vibronic coupling, and luminescence. In her free time, she occasionally becomes a Muay Thai fighter when calculations take forever, and a movie enthusiast whenever they finally converge perfectly."
