- name: "Brian KU"
  status: active
  image: "assets/people/brian.png"
  prose: "Brian joined the group as an FYP student and is currently a Research Assistant. His research focuses on developing and applying machine learning methods to electronic structure problems spanning materials science and molecular magnetism. Motivated by an interest in improving how scientific research is conducted, he supervises students and develops low-friction systems that improve knowledge sharing and accelerate scientific progress. Outside of work, or whenever the computing servers go down, he enjoys various sports, chess, exploring new places, or simply listening to classical music."
