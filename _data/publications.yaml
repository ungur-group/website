    pdf: "assets/publications/2020/Horii_CEJ_2020.pdf"
    si: "assets/publications/2020/Horii_CEJ_2020_SI.pdf"
  abstract: "Gd<sup>3+</sup> complexes have been shown to undergo unusual slow magnetic relaxation processes similar to those of single-molecule magnets (SMMs), even though Gd<sup>3+</sup> does not exhibit strong magnetic anisotropy. To reveal the origin of the slow magnetic relaxation of Gd<sup>3+</sup> complexes, we have investigated the magnetic properties and heat capacities of two Gd<sup>3+</sup>-phthalocyaninato triple-decker complexes, one of which has intramolecular Gd<sup>3+</sup>–Gd<sup>3+</sup> interactions and the other does not. It was found that the Gd<sup>3+</sup>–Gd<sup>3+</sup> interactions accelerate the magnetic relaxation processes. In addition, magnetically diluted samples, prepared by doping a small amount of the Gd<sup>3+</sup> complexes into a large amount of diamagnetic Y<sup>3+</sup> complexes, underwent dual magnetic relaxation processes. A detailed dynamic magnetic analysis revealed that the coexistence of spin–lattice relaxation and phonon-bottleneck processes is the origin of the dual magnetic relaxation processes."
  image: "assets/publications/2020/Horii_CEJ_2020.png"

