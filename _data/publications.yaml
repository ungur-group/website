    pdf: "assets/publications/2011/Ungur_PCCP_2011.pdf"
    si: "assets/publications/2011/Ungur_PCCP_2011_SI.pdf"
  abstract: "<i>Ab initio</i> investigation of multiplet spectrum of lanthanides in archetypal coordination geometries shows an unexpected regular structure consisting of (i) mirror symmetry of anisotropic magnetic properties of doublet states, (ii) high magnetic axiality of low-lying and high-lying doublets, comparable to complexes with ideal axial symmetry, and (iii) the strong rotation of the anisotropy axes of individual doublets. The obtained high axiality of the ground doublet states explains the SMM behaviour of low-symmetry lanthanide complexes."
