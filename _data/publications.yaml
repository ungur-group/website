    pdf: "assets/publications/2021/Grebenyuk_IC_2021.pdf"
    si: "assets/publications/2021/Grebenyuk_IC_2021_SI.pdf"
    cif: "assets/publications/2021/Grebenyuk_IC_2021.cif"
  abstract: "The unique family of coordination polymers [Ln<sub>4</sub>(OH)<sub>2</sub>(piv)<sub>10</sub>(H<sub>2</sub>O)<sub>2</sub>]<sub>∞</sub> of 11 lanthanides (Ln = La-Er) has been prepared by a simple solution method based on controlled hydrolysis. The ribbon-like polymeric structure consisting of connected tetranuclear clusters and supported by pivalate ligands and a framework of H-bonds has been revealed by single-crystal X-ray diffraction. While the compounds demonstrate similar PXRD patterns and unit cell parameters, the joint single-crystal XRD and pair distribution function data suggest the significant local structure change along the lanthanide series. The compounds exist as two packing polymorphs (α and β) with similar ribbon geometry, but different supramolecular arrangement of the ribbons. Dehydration of either polymorph does not disturb the tetranuclear core but leads to a translational symmetry loss along the ribbon and a transformation of the 3D-ordered crystal into a 2D-ordered mesostructure. Rehydration of the mesostructure leads to the β polymorph (except La and Ce), allowing the deliberate switching between the polymorphs via dehydration-rehydration evidenced by means of powder X-ray diffraction, pair distribution function analysis, and density functional theory calculations. Ab initio calculations reveal significant magnetic anisotropy of Ln<sup>3+</sup> ions with ferro- and antiferromagnetic interactions within tetranuclear [Ln<sub>4</sub>(OH)<sub>2</sub>(piv)<sub>10</sub>(H<sub>2</sub>O)<sub>2</sub>] species. Magnetic susceptibility measurements demonstrated antiferromagnetic coupling, slow magnetic relaxation for Dy, Ho, and Er complexes, and field-induced single-chain magnetism for the Dy compound."
  image: "assets/publications/2021/Grebenyuk_IC_2021.png"

