    cif: "assets/publications/2012/Langley_IC_2012.cif"
  abstract: "Using a heterometallic approach the synthesis, structures, and magnetic properties are reported for the complexes [Ln<sup>III</sup><sub>2</sub>Co<sup>III</sup><sub>2</sub>(OMe)<sub>2</sub>(teaH)<sub>2</sub>(O<sub>2</sub>CPh)<sub>4</sub>(MeOH)<sub>4</sub>](NO<sub>3</sub>)<sub>2</sub>·MeOH·H<sub>2</sub>O {Ln = Gd (<b>1a</b>), Tb (<b>2a</b>), and Dy (<b>3a</b>)} and [Ln<sup>III</sup><sub>2</sub>Co<sup>III</sup><sub>2</sub>(OMe)<sub>2</sub>(teaH)<sub>2</sub>(O<sub>2</sub>CPh)<sub>4</sub>(MeOH)<sub>2</sub>(NO<sub>3</sub>)<sub>2</sub>]·MeOH·H<sub>2</sub>O {Ln = Gd (<b>1b</b>), Tb (<b>2b</b>), and Dy (<b>3b</b>)}. Both compounds for the respective lanthanide ions are found to be isolated within the same crystal. Each Ln<sup>III</sup> dinuclear unit is incorporated within a diamagnetic Co<sup>III</sup>/organic ligand backbone utilizing triethanolamine and benzoic acid as bridging ligands. Magnetic studies reveal an absence of any observable coupling interaction for the Gd case. The Dy analogue displays single molecule magnet (SMM) behavior with a large energy barrier to magnetization reversal of 88.8 K, and the quantum tunneling of the magnetization (QTM) is effectively suppressed because of the nonmagnetic exchange ground state of the molecule. Dilution of the Dy complex into an isostructural diamagnetic yttrium matrix allowed us to determine aspects of the relaxation mechanism within the system."
