    si: "assets/publications/2013/Chorazy_CEC_2013_SI.pdf"
    cif: "assets/publications/2013/Chorazy_CEC_2013.cif"
  abstract: "The novel layered {Co<sup>II</sup><sub>3</sub>(2,2′-bpdo)<sub>4</sub>(H<sub>2</sub>O)<sub>4</sub>[W<sup>V</sup>(CN)<sub>8</sub>]<sub>2</sub>}·8H<sub>2</sub>O (<b>1</b>) network (2,2′-bpdo = 2,2′-bipyridine-1,1′-dioxide) is built of 2-D corrugated cyanide-bridged brick-wall skeletons parallel to the bc crystallographic plane. The coordination of chelating 2,2′-bpdo to Co(II) gives 7-membered coordination rings. Magnetic and heat capacity measurements performed on monocrystalline samples reveal ferromagnetic ordering below <i>T</i><sub>C</sub> of 6 K. Magnetic anisotropy of the ordered phase is represented by the easy axis oriented in the ac crystallographic plane. Bulk magnetic anisotropy is confronted with a local anisotropy of Co complexes: a strong axial anisotropy of trans,cis,cis-[Co<sup>II</sup>(μ-NC)<sub>2</sub>(H<sub>2</sub>O)<sub>2</sub>(2,2′-bpdo)] moieties represented by <i>g</i><sub>x</sub><sup>(2)</sup> = 2.06, <i>g</i><sub>y</sub><sup>(2)</sup> = 2.95 and <i>g</i><sub>z</sub><sup>(2)</sup> = 7.30, and a planar anisotropy of trans,cis,cis-[Co<sup>II</sup>(μ-NC)<sub>2</sub>(2,2′-bpdo)<sub>2</sub>] represented by <i>g</i><sub>x</sub><sup>(3)</sup> = 5.40, <i>g</i><sub>y</sub><sup>(3)</sup> = 4.82 and <i>g</i><sub>z</sub><sup>(3)</sup> = 2.28, determined by CASSCF/RASSI/SINGLE_ANISO <i>ab initio</i> calculations. The experimental data are explained by the molecular field simulation of the magnetic structure using the above theoretical data."
  image: "assets/publications/2013/Chorazy_CEC_2013.png"

- title: An Organometallic Building Block Approach To Produce a Multidecker 4f Single-Molecule Magnet
  authors:
    - J. J. Le Roy
    - M. Jeletic
    - S. I. Gorelsky
    - I. Korobkov
    - L. Ungur
    - L. F. Chibotaru
    - M. Murugesu
  group_members:
    - L. Ungur
  year: "2013"
  journal: Journal of the American Chemical Society
  links:
    doi: 10.1021/ja310642h
    pdf: "assets/publications/2013/LeRoy_JACS_2013.pdf"
    si: "assets/publications/2013/LeRoy_JACS_2013_SI.pdf"
    cif: "assets/publications/2013/LeRoy_JACS_2013.cif"
  abstract: "An organometallic building block strategy was employed to investigate the magnetic properties of a Ln<sup>III</sup> organometallic single-ion magnet (SIM) and subsequent single-molecule magnet (SMM) after coupling two of the monomeric units. New homoleptic Dy<sup>III</sup>COT″<sub>2</sub> and Ln<sup>III</sup><sub>2</sub>COT″<sub>3</sub> (Ln = Gd, Dy) complexes have been synthesized. DFT calculations of the bimetallic Dy<sup>III</sup> complex indicate strong metal–ligand covalency and uneven donation to the Dy<sup>III</sup> ions by the terminal and internal COT″<sup>2-</sup> (cyclooctatetraenide) rings that correlate with the respective bond distances. Interestingly, the studies also point to a weak covalent interaction between the metal centers, despite a large separation. The ac susceptibility data indicates that both Dy<sup>III</sup>COT″<sub>2</sub> and Dy<sup>III</sup><sub>2</sub>COT″<sub>3</sub> act as an SIM and an SMM, respectively, with complex multiple relaxation mechanisms. <i>Ab initio</i> calculations reveal the direction of the magnetic anisotropic axis is not perpendicular to the planar COT″ rings for both Dy<sup>III</sup>COT″<sub>2</sub> and Dy<sup>III</sup><sub>2</sub>COT″<sub>3</sub> complexes due to the presence of trimethylsilyl groups on the COT″ rings. If these bulky groups are removed, the calculations predict reorientation of the anisotropic axis can be achieved."
  image: "assets/publications/2013/LeRoy_JACS_2013.png"

- title: "By Design: A Macrocyclic 3d-4f Single-Molecule Magnet with Quantifiable Zero-Field Slow Relaxation of Magnetization"
  authors:
