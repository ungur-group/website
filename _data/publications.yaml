- title: J ̃ -pseudospin states and the crystal field of cubic systems
  authors:
    - N. Iwahara
    - L. Ungur
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2018"
  journal: Physical Review B
  links:
    doi: 10.1103/PhysRevB.98.054436
    pdf: "assets/publications/2018/Iwahara_PRB_2018.pdf"
  abstract: "The theory of <i>J</i>̃ pseudospin for the <i>f</i> element in a cubic environment is developed. By fulfilling the symmetry requirements and the adiabatic connection to the atomic limit, the crystal-field states are uniquely transformed into <i>J</i>̃-pseudospin states. In terms of the pseudospin operators, both the total angular momentum and the crystal-field Hamiltonian contain higher-rank tensor terms than the traditional ones do, which means the present framework naturally includes effects such as covalency and <i>J</i> mixing beyond the <i>f</i>-shell model. Combining the developed theory with ab initio calculations, the <i>J</i>̃-pseudospin states for Nd<sup>3+</sup> and Np<sup>4+</sup> ions in octahedral sites of insulators are derived."
  image: "assets/publications/2018/Iwahara_PRB_2018.png"

- title: "Magnetization Blocking in Fe<sub>2</sub><sup>III</sup>Dy<sub>2</sub><sup>III</sup> Molecular Magnets: Ab Initio Calculations and EPR Spectroscopy"
  authors:
    - V. Vieru
    - L. Ungur
    - V. Cemortan
    - A. Sukhanov
    - A. Baniodeh
    - C. E. Anson
    - A. K. Powell
    - V. Voronkova
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2018"
  journal: Chemistry – A European Journal
  links:
    doi: 10.1002/chem.201803821
    pdf: "assets/publications/2018/Vieru_CEJ_2018.pdf"
    si: "assets/publications/2018/Vieru_CEJ_2018_SI.pdf"
    cif: "assets/publications/2018/Vieru_CEJ_2018.cif"
  abstract: "The magnetism and magnetization blocking of a series of [Fe<sup>III</sup><sub>2</sub>Dy<sup>III</sup><sub>2</sub>(OH)<sub>2</sub>(teaH)<sub>2</sub>(RC<sub>6</sub>H<sub>4</sub>COO)<sub>6</sub>] complexes was investigated, in which teaH<sub>3</sub>=triethanolamine and R=meta-CN (<b>1</b>), para-CN (<b>2</b>), meta-CH<sub>3</sub> (<b>3</b>), para-NO<sub>2</sub> (<b>4</b>) and para-CH<sub>3</sub> (<b>5</b>), by combining ab initio calculations and EPR measurements. The results of broken-symmetry DFT calculations show that in all compounds the Fe–Fe exchange interaction is antiferromagnetic and stronger by far than the Fe–Dy and Dy–Dy interactions. As a result, the lowest two exchange doublets probed by EPR spectroscopy mostly originate from the Ising interaction of the dysprosium ions in all compounds. A correct quantitative description of the splitting of these two doublets requires, however, an explicit account of the Fe–Dy and Fe–Fe interactions. Due to the inversion symmetry of the complexes, the doublets under consideration are described by a collinear Ising exchange interaction. This picture is also supported by the EPR spectra, which could be simulated with parameters close to those extracted from the calculations. The magneto-structural analysis shows an increase of the antiferromagnetic Fe–Fe exchange interaction with increasing Fe-O-Fe angle and Fe–Fe distance. For the Dy–Fe interaction, the opposite tendency is observed, that is, a decrease of antiferromagnetic exchange coupling with increasing Dy-O-Fe angle and Dy–Fe distance. The transversal <i>g</i> factors extracted from the ab initio calculations have values in the range of 0.01–0.2, testifying to the lack of high axiality of the ground state of the dysprosium ions. This explains the lack/poor single-molecule magnetic behavior of this series of compounds at the investigated temperatures of a few Kelvin. Due to a very small gap (fractions of a wavenumber) between the ground and first-excited exchange doublet, relaxation takes place by magnetic moment reversal at individual dysprosium sites in the considered temperature domain."
  image: "assets/publications/2018/Vieru_CEJ_2018.png"

