    cif: "assets/publications/2018/Zhang_CS_2018.cif"
  abstract: "Tetraoxolene radical-bridged lanthanide SMM systems were prepared for the first time by reduction of the respective neutral compounds. Magnetic measurements reveal the profound influence of the radical center on magnetic behavior. Strong magnetic couplings are revealed in the radical species, which switch on SMM behavior under zero applied field for Dy<sup>III</sup> and Tb<sup>III</sup> compounds. HFEPR spectra unravel the contributions of the magnetic coupling and the magnetic anisotropy. For Gd<sup>III</sup> this results in much more accurate magnetic coupling parameters with respect to bulk magnetic measurements."
