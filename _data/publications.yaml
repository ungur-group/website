    cif: "assets/publications/2014/Mondal_EJIC_2014.cif"
  abstract: "The bisadduct (cAAC)<sub>2</sub>Ni<sup>II</sup>Cl<sub>2</sub> (<b>1</b>; cAAC = cyclic (alkyl)(amino)carbene) was directly synthesized by treating cAAC with NiCl<sub>2</sub>. Compound <b>1</b> was reduced to (cAAC)<sub>2</sub>Ni<sup>0</sup> (<b>2</b>) by using lithium diisopropylamide or KC<sub>8</sub>. Crystals of <b>2</b> were stable under an inert gas for several months and decomposed upon heating above 165 °C. On the basis of the calculated natural bond orbital charge values of the nickel atom in <b>2</b>, the oxidation state of nickel was determined to be between Ni<sup>I</sup> and Ni<sup>0</sup> (+0.34). Theoretical calculations suggested a closed-shell singlet electronic configuration of <b>2</b> with little biradical character. Ab initio multiconfigurational C(R)ASSCF/CASPT2 calculations predicted a closed-shell singlet electronic configuration (Ni<sup>0</sup>), whereas excited spin states possessed Ni<sup>I</sup> character with unpaired electrons on neighboring carbon atoms. The catalytic activity of complex <b>2</b> was investigated for the homocoupling of various unactivated aryl chlorides/fluorides. The biaryls were obtained in good yields at moderate temperature. Theoretical studies showed that an intermediate containing Ni<sup>III</sup> was more favored than one with Ni<sup>IV</sup>."
