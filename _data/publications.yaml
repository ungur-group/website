  abstract: "The sulfur-bridged dimers [{Cp′<sub>2</sub>Ln(μ-SSiPh<sub>3</sub>)}<sub>2</sub>] (Ln=Gd (<b>1</b>), Dy (<b>2</b>); Cp′=η<sup>5</sup>-C<sub>5</sub>H<sub>4</sub>Me) were synthesized by the transmetalation reactions between [Cp′<sub>3</sub>Ln] and Ph<sub>3</sub>SiSLi. Compound <b>2</b> is a single-molecule magnet with slow relaxation of magnetization up to 40 K and an anisotropy barrier of <i>U</i><sub>eff</sub>=133 cm<sup>-1</sup>. Insight into the SMM properties of <b>2</b> and closely related SMMs has been obtained using <i>ab initio</i> calculations."
