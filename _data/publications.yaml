  year: "2011"
  journal: Journal of the American Chemical Society
  links:
    doi: 10.1021/ja109706y
    pdf: "assets/publications/2011/Long_JACS_2011.pdf"
    si: "assets/publications/2011/Long_JACS_2011_SI.pdf"
    cif: "assets/publications/2011/Long_JACS_2011.cif"
  abstract: "A family of five dinuclear lanthanide complexes has been synthesized with general formula [Ln<sup>III</sup><sub>2</sub>(valdien)<sub>2</sub>(NO<sub>3</sub>)<sub>2</sub>] where (H<sub>2</sub>valdien = N<sup>1</sup>,N<sup>3</sup>-bis(3-methoxysalicylidene)diethylenetriamine) and Ln<sup>III</sup> = Eu<sup>III</sup> (<b>1</b>), Gd<sup>III</sup> (<b>2</b>), Tb<sup>III</sup> (<b>3</b>), Dy<sup>III</sup> (<b>4</b>), and Ho<sup>III</sup> (<b>5</b>). The magnetic investigations reveal that <b>4</b> exhibits single-molecule magnet (SMM) behavior with an anisotropic barrier <i>U</i><sub>eff</sub> = 76 K. The step-like features in the hysteresis loops observed for <b>4</b> reveal an antiferromagnetic exchange coupling between the two dysprosium ions. <i>Ab initio</i> calculations confirm the weak antiferromagnetic interaction with an exchange constant <i>J</i><sub>Dy-Dy</sub> = -0.21 cm<sup>-1</sup>. The observed steps in the hysteresis loops correspond to a weakly coupled system similar to exchange-biased SMMs. The Dy<sub>2</sub> complex is an ideal candidate for the elucidation of slow relaxation of the magnetization mechanism seen in lanthanide systems."
  image: "assets/publications/2011/Long_JACS_2011.png"

- title: Structure, Magnetism and Theory of a Family of Nonanuclear Cu<sup>II</sup><sub>5</sub>Ln<sup>III</sup><sub>4</sub> –Triethanolamine Clusters Displaying Single-Molecule Magnet Behaviour
  authors:
