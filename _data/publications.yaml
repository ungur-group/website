    si: "assets/publications/2016/Jiang_RSCA_2016_SI.pdf"
    cif: "assets/publications/2016/Jiang_RSCA_2016.cif"
  abstract: "A series of centrosymmetric dinuclear lanthanide complexes, including Gd<sup>III</sup> (<b>1</b>), Dy<sup>III</sup> (<b>2</b>), Ho<sup>III</sup> (<b>3</b>), Er<sup>III</sup> (<b>4</b>) and Yb<sup>III</sup> (<b>5</b>), have been synthesized and studied for the effects of lanthanide contraction on their magnetic properties. As a result of probing the magnetic properties of the Gd<sup>III</sup> analogue, <b>1</b>, a weak antiferromagnetic intramolecular interaction was confirmed, with <i>J</i> = −0.01 cm<sup>-1</sup> and <i>g</i> = 2.01. The Dy<sup>III</sup> complex, <b>2</b>, was found to exhibit larger values of <i>g</i><sub>x</sub> and <i>g</i><sub>y</sub> in the ground doublet of individual Dy<sup>III</sup> ions via ab initio calculations, and thus did not act as a SMM. Interestingly, the Er<sup>III</sup> (<b>4</b>) and Yb<sup>III</sup> (<b>5</b>) complexes exhibited slow relaxation of the magnetization under an applied dc field with effective energy barriers (<i>U</i><sub>eff</sub>) of 21 K and 22 K, respectively."
  image: "assets/publications/2016/Jiang_RSCA_2016.png"

- title: Multitechnique investigation of Dy<sub>3</sub> – implications for coupled lanthanide clusters
  authors:
    - M. Gysler
    - F. El Hallak
    - L. Ungur
    - R. Marx
    - M. Hakl
    - P. Neugebauer
    - Y. Rechkemmer
    - Y. Lan
    - I. Sheikin
    - M. Orlita
    - C. E. Anson
    - A. K. Powell
    - R. Sessoli
