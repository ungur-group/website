    pdf: "assets/publications/2020/Zhang_Matter_2020.pdf"
    si: "assets/publications/2020/Zhang_Matter_2020_SI.pdf"
    cif: "assets/publications/2020/Zhang_Matter_2020.cif"
  abstract: "Toroidal molecular magnets represent promising candidates for next-generation ultra-dense information storage. These wheel-like molecules are able to store one bit per molecule because of their insensitivity to homogeneous magnetic fields—one of the main sources of magnetic perturbations. However, synthesis of molecules possessing a well-defined and stable vortex arrangement of the on-site magnetic moments in the ground state represents a challenge. Here, we show that 16 magnetic metal ions can be alternately arranged into a macrocycle named {Fe<sub>8</sub>Dy<sub>8</sub>}. The net toroidal moment can be experimentally determined at 0.23 Tesla. Moreover, ab initio calculations were performed to reveal that ferromagnetic exchange interactions between the Fe<sup>III</sup> and Dy<sup>III</sup> metal centers are the key to generate this toroidal moment. This feature is significantly distinguished from the previously described dipole-dipole interactionbased single-molecule toroics (SMTs), showing the importance of exchange-coupling interactions in the design of next-generation SMTs."
  image: "assets/publications/2020/Zhang_Matter_2020.png"

- title: Coexistence of Spin–Lattice Relaxation and Phonon-Bottleneck Processes in Gd<sup>III</sup> –Phthlocyaninato Triple-Decker Complexes under Highly Diluted Conditions
  authors:
