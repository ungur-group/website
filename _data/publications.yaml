  year: "2020"
  journal: CCS Chemistry
  links:
    doi: 10.31635/ccschem.020.202000204
    pdf: "assets/publications/2020/Wu_CCS_Chem_2020.pdf"
    si: "assets/publications/2020/Wu_CCS_Chem_2020_SI.pdf"
  abstract: "Dynamic molecular materials, which involve mechanical motions in crystals, usually exhibit tunable properties related to conformational polymorphs. Herein, we describe a solvent-free molecular crystal [{Fe<sup>III</sup>(salten)}<sub>2</sub>(TPB)](BPh<sub>4</sub>)<sub>2</sub> (<b>I</b>) developed by associating the rotatable tetraphenylborate anion with the spin crossover (SCO) binuclear iron(III) cation. The solvent-free phase <b>I</b> can undergo a temperature-induced phase transformation to phase <b>II</b>, during which rotation of the BPh<sub>4</sub><sup>-</sup> anion interplays with the SCO component, giving rise to fascinating variations in SCO (from gradual to abrupt) and dielectric properties. Most importantly, an unexpected polymorphic transformation from <b>II</b> to <b>III</b> or <b>IV</b>, with increasing magnetic hysteresis, is realized by exposing <b>II</b> to water or ethanol vapor; the transition is reversible by heating. This rare successive transformation is further rationalized by theoretical calculations. Hence, this multiresponse system provides a new way for modulating synergistic effects and designing dynamic SCO materials by integrating intramolecular motions in the crystal lattice."
  image: "assets/publications/2020/Wu_CCS_Chem_2020.png"

- title: Understanding the magnetization blocking mechanism in N<sub>2</sub><sup>3-</sup> -radical-bridged dilanthanide single-molecule magnets
  authors:
