    pdf: "assets/publications/2023/Arumugam_DT_2023.pdf"
    si: "assets/publications/2023/Arumugam_DT_2023_SI.pdf"
  abstract: "The present work describes the dynamic magnetic properties of the complex [(Cp<sup>Ar3</sup>)<sub>4</sub>Dy<sup>III</sup><sub>2</sub>Cl<sub>4</sub>K<sub>2</sub>]·3.5(C<sub>7</sub>H<sub>8</sub>) (<b>1</b>), synthesized by employing a tri-aryl-substituted cyclopentadienyl ligand (Cp<sup>Ar3</sup>), [4,4′-(4-phenylcyclopenta-1,3-diene-1,2-diyl)bis(methylbenzene) = Cp<sup>Ar3</sup>H]. Each Dy<sup>III</sup>-metallocene weakly couples via K<sub>2</sub>Cl<sub>4</sub>, displaying slow relaxation of magnetization below 14.5 K under zero applied dc field via KD<sub>3</sub> energy levels with an energy barrier of 136.9/133.7 cm<sup>-1</sup> on the Dy sites. The single-ion axial anisotropy energy barrier is reduced by geometrical distortion due to the coordination of two chloride ions at each Dy centre."
  image: "assets/publications/2023/Arumugam_DT_2023.png"

- title: "Dysprosium-Radical Based Single-Molecule Magnet Containing a Seven Coordinate Dy(III) Ion: A System for <i>ab initio</i> Study"
  authors:
