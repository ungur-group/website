  abstract: "A reversible single-crystal-to-single-crystal transformation is used to dramatically change the relaxation behavior of a single-ion magnet. The coordination geometry of the Dy<sup>III</sup> site of a [Zn–Dy–Zn] complex changes from pentagonal–bipyramid (quasi-D<sub>5h</sub>) to octahedron (quasi-O<sub>h</sub>), inducing an energy barrier change from 305 cm<sup>-1</sup> (439 K) to a negligible value, respectively. <i>Ab initio</i> calculations reveal that the ideal D<sub>5h</sub>–Dy<sup>III</sup> is of perfect axiality with a substantial energy barrier in accordance with the experimental result."
