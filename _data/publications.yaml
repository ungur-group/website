  year: "2020"
  journal: Inorganic Chemistry
  links:
    doi: 10.1021/acs.inorgchem.0c00616
    pdf: "assets/publications/2020/Li_IC_2020.pdf"
    si: "assets/publications/2020/Li_IC_2020_SI.pdf"
    cif: "assets/publications/2020/Li_IC_2020.cif"
  abstract: "It is a crucial challenge to address both magnetic anisotropy and stability for single-molecule magnets (SMMs) used in next-generation nanodevices. Highly axial lanthanide SMMs with neutral charge and moderate coordination numbers represent promising magnetic materials. Here, using iodide ions with large volume and low surface charge density as weak donors, we report a six-coordinate neutral dysprosium SMM [Dy(Cy<sub>3</sub>PO)<sub>2</sub>I<sub>3</sub>(CH<sub>3</sub>CN)] with a certain degree of stability exhibiting a huge thermal barrier of 1062 K and hysteresis loops open up to 9 K. Through the elaborate reduction of ligand field strength, an apparent strongly axial crystal field is provided which elicits prominent crystal-field splitting and high axiality with the thermally activated relaxation via the third-excited Kramers' doublet. Moreover, the profound influence of strong equatorial ligand substitution on the electronic structure and relaxation pathway is clearly explored in Dy<sup>III</sup> analogues. The result suggests the great potential of the reducing the transverse ligand field in the improvement of SMMs performance."
  image: "assets/publications/2020/Li_IC_2020.png"

- title: Magnetic Anisotropy in Divalent Lanthanide Compounds
  authors:
    - W. Zhang
    - A. Muhtadi
    - N. Iwahara
    - L. Ungur
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2020"
  journal: Angewandte Chemie International Edition
  links:
    doi: 10.1002/anie.202003399
    pdf: "assets/publications/2020/Zhang_Angew_2020.pdf"
    si: "assets/publications/2020/Zhang_Angew_2020_SI.pdf"
  abstract: "Complexes of trivalent lanthanides (Ln) are known to possess strong magnetic anisotropy, which enables them to be efficient single-molecule magnets. High-level ab initio calculations are reported for [LnO] (where Ln is terbium (Tb), dysprosium (Dy), or holmium (Ho)), which show that divalent lanthanides can exhibit equally strong magnetic anisotropy and magnetization blocking barriers. In particular, detailed calculations predict a multilevel magnetization blocking barrier exceeding 3000 K for a [DyO] complex deposited on a hexagonal boron nitride (h-BN) surface, bringing the expected performance of single-molecule magnets to a qualitatively new level compared to the current state-of-the art complexes."
  image: "assets/publications/2020/Zhang_Angew_2020.png"

- title: Single-Molecule Toroic Design through Magnetic Exchange Coupling
  authors:
    - H. L. Zhang
    - Y. Q. Zhai
    - L. Qin
