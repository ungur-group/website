- title: "Pure Trinuclear 4f Single-Molecule Magnets: Synthesis, Structures, Magnetism and Ab Initio Investigation"
  authors:
    - F. Guo
    - J. Liu
    - J. Leng
    - Z. Meng
    - Z. Lin
    - M. Tong
    - S. Gao
    - L. Ungur
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2011"
  journal: Chemistry – A European Journal
  links:
    doi: 10.1002/chem.201002296
    pdf: "assets/publications/2011/Guo_CEJ_2011.pdf"
    si: "assets/publications/2011/Guo_CEJ_2011_SI.pdf"
    cif: "assets/publications/2011/Guo_CEJ_2011.cif"
  abstract: "A family of linear Dy<sub>3</sub> and Tb<sub>3</sub> clusters have been facilely synthesized from the reactions of DyCl<sub>3</sub>, the polydentate 3-methyloxysalicylaldoxime (MeOsaloxH<sub>2</sub>) ligand with auxiliary monoanionic ligands, such as trichloroacetate, NO<sub>3</sub><sup>-</sup>, OH<sup>-</sup>, and Cl<sup>-</sup>. Complexes <b>1</b>–<b>5</b> contain a nearly linear Ln<sub>3</sub> core, with similar Ln···Ln distances (3.6901(4)–3.7304(3) Å for the Dy<sub>3</sub> species, and 3.7273(3)–3.7485(5) Å for the Tb<sub>3</sub> species) and Ln···Ln···Ln angles of 157.036(8)–159.026(15)° for the Dy<sub>3</sub> species and 157.156(8)–160.926(15)° for the Tb<sub>3</sub> species. All three Ln centers are bridged by the two doubly-deprotonated [MeOsalox]<sup>2-</sup> ligands and two of the four [MeOsaloxH]<sup>-</sup> ligands through the N,O-η<sup>2</sup>-oximato groups and the phenoxo oxygen atoms (Dy-O-Dy angles=102.28(16)–106.85(13)°; Tb-O-Tb angles=102.00(11)–106.62(11)°). The remaining two [MeOsaloxH]<sup>-</sup> ligands each chelate an outer Ln<sup>III</sup> center through their phenoxo oxygen and oxime nitrogen atoms. Magnetic studies reveal that both Dy<sub>3</sub> and Tb<sub>3</sub> clusters exhibit significant ferromagnetic interactions and that the Dy<sub>3</sub> species behave as single-molecule magnets, expanding upon the recent reports of the pure 4f type SMMs."
  image: "assets/publications/2011/Guo_CEJ_2011.png"

