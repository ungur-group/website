  abstract: "Thirteen tetranuclear mixed-metal complexes of the hexaimine macrocycle (LPr)<sup>6-</sup> have been prepared in a one-pot 3:1:3:3 reaction of copper(II) acetate hydrate, the appropriate lanthanide(III) nitrate hydrate, 1,4-diformyl-2,3-dihydroxybenzene (<b>1</b>), and 1,3-diaminopropane. The resulting family of copper(II)–lanthanide(III) macrocyclic complexes has the general formula Cu<sup>II</sup><sub>3</sub>Ln<sup>III</sup>(LPr)(NO<sub>3</sub>)<sub>3</sub>·solvents (Ln = La, Ce, Pr, Nd, Sm, Eu, Gd, Dy, Tb, Ho, Er, Tm, or Yb). X-ray crystal structure determinations carried out on [Cu<sub>3</sub>Ce(LPr)(NO<sub>3</sub>)<sub>3</sub>(MeOH)<sub>3</sub>] and [Cu<sub>3</sub>Dy(LPr)(NO<sub>3</sub>)<sub>3</sub>(MeOH)<sub>3</sub>] confirmed that the large Ln<sup>III</sup> ion is bound in the central O<sub>6</sub> site and the three square pyramidal Cu<sup>II</sup> ions in the outer N<sub>2</sub>O<sub>2</sub> sites (apical donor either nitrate anion or methanol molecule) of the Schiff base macrocycle. Only the structurally characterized Cu<sub>3</sub>Tb complex, reported earlier, is a single-molecule magnet (SMM): the other 12 complexes do not exhibit an out-of-phase ac susceptibility signal or hysteresis of magnetization in a dc field. <i>Ab initio</i> calculations allowed us to rationalize the observed magnetic properties, including the significant impact of subtle chemical modification on SMM behavior. Broken-symmetry density functional theory (BS-DFT) calculations show there is a subtle structural balance as to whether the Cu···Cu exchange coupling is ferro- or antiferromagnetic. Of the family of 13 magnetically characterized tetranuclear Cu<sup>II</sup><sub>3</sub>Ln<sup>III</sup> macrocyclic complexes prepared, only the Tb<sup>III</sup> complex is an SMM: the theoretical reasons for this are discussed."
  image: "assets/publications/2012/Feltham_IC_2012.png"

- title: Heterometallic Tetranuclear [Ln<sup>III</sup><sub>2</sub>Co<sup>III</sup><sub>2</sub>] Complexes Including Suppression of Quantum Tunneling of Magnetization in the [Dy<sup>III</sup><sub>2</sub>Co<sup>III</sup><sub>2</sub>] Single Molecule Magnet
  authors:
