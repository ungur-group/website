  abstract: "A defective cubane-shaped heterometallic trinuclear Co<sup>III</sup><sub>2</sub>Dy<sup>III</sup> compound with only one magnetically interesting ion (Dy<sup>III</sup>) has been assembled by virtue of a multifunctional acylhydrazone ligand. Because of the nonaxial ground state of Dy<sup>III</sup> ion derived from a low-symmetrical crystal field, the title compound displays field-induced multiple relaxation processes which are of molecular and a dipolar-dipolar coupling origin, as revealed by combined experimental and theoretical investigations. The results demonstrate that such a mononuclear dysprosium(III) compound with a low-symmetrical environment of magnetic center appears to be a model system for further investigations to shed light on the complex relaxation mechanism of lanthanide-based single ion magnets."
  image: "assets/publications/2014/Xue_IC_2014.png"

- title: Observation of unusual slow-relaxation of the magnetisation in a Gd-EDTA chelate
  authors:
