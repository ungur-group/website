  links:
    doi: 10.1021/ic5029788
    pdf: "assets/publications/2015/Huang_IC_2015.pdf"
    si: "assets/publications/2015/Huang_IC_2015_SI.pdf"
    cif: "assets/publications/2015/Huang_IC_2015.cif"
  abstract: "Inverse sandwich biphenyl complexes [(NNTBS)Ln]<sub>2</sub>(μ-biphenyl)[K(solvent)]<sub>2</sub> [NNTBS = 1,1'-fc(NSitBuMe<sub>2</sub>)<sub>2</sub>; Ln = Gd, Dy, Er; solvent = Et<sub>2</sub>O, toluene; 18-crown-6], containing a quadruply reduced biphenyl ligand, were synthesized and their magnetic properties measured. One of the dysprosium biphenyl complexes was found to exhibit antiferromagnetic coupling and single-molecule-magnet behavior with <i>U</i><sub>eff</sub> of 34 K under zero applied field. The solvent coordinated to potassium affected drastically the nature of the magnetic interaction, with the other dysprosium complex showing ferromagnetic coupling. Ab initio calculations were performed to understand the nature of magnetic coupling between the two lanthanide ions bridged by the anionic arene ligand and the origin of single-molecule-magnet behavior."
