- title: Hysteresis in the ground and excited spin state up to 10 T of a [Mn<sup>III</sup><sub>6</sub>Mn<sup>III</sup>]<sup>3+</sup> triplesalen single-molecule magnet
  authors:
    - V. Hoeke
    - K. Gieb
