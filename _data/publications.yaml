    cif: "assets/publications/2014/Mondal_JACS_2014.cif"
  abstract: "Me<sub>2</sub>-cAAC:)<sub>2</sub>Co<sub>2</sub> (<b>2</b>, where Me<sub>2</sub>-cAAC: = cyclic alkyl amino carbene, :C(CH<sub>2</sub>)(CMe<sub>2</sub>)<sub>2</sub>N-2,6-iPr<sub>2</sub>C<sub>6</sub>H<sub>3</sub>)) was synthesized via the reduction of precursor (Me<sub>2</sub>-cAAC:Co<sup>II</sup>(μ-Cl)Cl)<sub>2</sub> (<b>1</b>) with KC<sub>8</sub>. <b>2</b> contains two cobalt atoms in the formal oxidation state zero. Magnetic measurement revealed that <b>2</b> has a singlet spin ground state <i>S</i> = 0. The cyclic voltammogram of <b>2</b> exhibits both one-electron oxidation and reduction, indicating the possible synthesis of stable species containing <b>2</b><sup>•-</sup> and <b>2</b><sup>•+</sup> ions. The latter was synthesized via reduction of <b>1</b> with required equivalents of KC<sub>8</sub> and characterized as [(Me<sub>2</sub>-cAAC:)<sub>2</sub>Co<sub>2</sub>]<sup>•+</sup>OTf<sup>-</sup> (<b>2</b><sup>•+</sup>OTf<sup>-</sup>). Electron paramagnetic resonance spectroscopy of <b>2</b><sup>•+</sup> reveals the coupling of the electron spin with 2 equiv <sup>59</sup>Co isotopes, leading to a (Co<sup>0.5</sup>)<sub>2</sub> state. The experimental Co1–Co2 bond distances are 2.6550(6) and 2.4610(6) Å for <b>2</b> and <b>2</b><sup>•+</sup>OTf<sup>-</sup>, respectively. Theoretical investigation revealed that both <b>2</b> and <b>2</b><sup>•+</sup>OTf<sup>-</sup> possess a Co–Co bond with an average value of 2.585 Å. A slight increase of the Co–Co bond length in <b>2</b> is more likely to be caused by the strong π-accepting property of cAAC. <b>2</b><sup>•+</sup> is only 0.8 kcal/mol higher in energy than the energy minimum. The shortening of the Co–Co bond of <b>2</b><sup>•+</sup> is caused by intermolecular interactions."
  image: "assets/publications/2014/Mondal_JACS_2014.png"

- title: Fine-tuning the Local Symmetry to Attain Record Blocking Temperature and Magnetic Remanence in a Single-Ion Magnet
  authors:
    - L. Ungur
    - J. J. Le Roy
    - I. Korobkov
    - M. Murugesu
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2014"
  journal: Angewandte Chemie International Edition
  links:
    doi: 10.1002/anie.201310451
    pdf: "assets/publications/2014/Ungur_Angew_2014.pdf"
    si: "assets/publications/2014/Ungur_Angew_2014_SI.pdf"
  abstract: "Remanence and coercivity are the basic characteristics of permanent magnets. They are also tightly correlated with the existence of long relaxation times of magnetization in a number of molecular complexes, called accordingly single-molecule magnets (SMMs). Up to now, hysteresis loops with large coercive fields have only been observed in polynuclear metal complexes and metal-radical SMMs. On the contrary, mononuclear complexes, called single-ion magnets (SIM), have shown hysteresis loops of butterfly/phonon bottleneck type, with negligible coercivity, and therefore with much shorter relaxation times of magnetization. A mononuclear Er<sup>III</sup> complex is presented with hysteresis loops having large coercive fields, achieving 7000 Oe at <i>T</i> = 1.8 K and field variation as slow as 1 h for the entire cycle. The coercivity persists up to about 5 K, while the hysteresis loops persist to 12 K. Our finding shows that SIMs can be as efficient as polynuclear SMMs, thus opening new perspectives for their applications."
  image: "assets/publications/2014/Ungur_Angew_2014.png"

- title: "Single-Molecule Magnetism in a Family of {Co<sup>III</sup><sub>2</sub>Dy<sup>III</sup><sub>2</sub>} Butterfly Complexes: Effects of Ligand Replacement on the Dynamics of Magnetic Relaxation"
  authors:
    - S. K. Langley
    - L. Ungur
    - N. F. Chilton
