- title: "Heterometallic 3d–4f Single-Molecule Magnets: Ligand and Metal Ion Influences on the Magnetic Relaxation"
  authors:
    - S. K. Langley
    - C. Le
    - L. Ungur
    - B. Moubaraki
    - B. F. Abrahams
    - L. F. Chibotaru
    - K. S. Murray
  group_members:
    - L. Ungur
  year: "2015"
  journal: Inorganic Chemistry
  links:
    doi: 10.1021/acs.inorgchem.5b00219
    pdf: "assets/publications/2015/Langley_IC_2015.pdf"
    si: "assets/publications/2015/Langley_IC_2015_SI.pdf"
    cif: "assets/publications/2015/Langley_IC_2015.cif"
  abstract: "Six tetranuclear 3d-4f single-molecule magnet (SMM) complexes formed using N-n-butyldiethanolamine and N-methyldiethanolamine in conjunction with ortho- and para-substituted benzoic acid and hexafluoroacetoacetone ligands yield two families, both having a butterfly metallic core. The first consists of four complexes of type {Co<sup>III</sup><sub>2</sub>Co<sup>II</sup>Dy<sup>III</sup><sub>2</sub>} and {Co<sup>III</sup><sub>2</sub>Co<sup>II</sup>Co<sup>II</sup>Dy<sup>III</sup>} using N-n-butyldiethanolamine with variation of the carboxylate ligand. The anisotropy barriers are 80 cm<sup>-1</sup>, (77 and 96 cm<sup>-1</sup>—two relaxation processes occur), 117 and 88 cm<sup>-1</sup>, respectively, each following a relaxation mechanism from a single Dy<sup>III</sup> ion. The second family consists of a {Co<sup>III</sup><sub>2</sub>Co<sup>II</sup>Dy<sup>III</sup><sub>2</sub>} and a {Cr<sup>III</sup><sub>2</sub>Co<sup>II</sup>Dy<sup>III</sup><sub>2</sub>} complex, from the ligand combination of N-methyldiethanolamine and hexafluoroacetylacetone. Both show SMM behavior, the Co<sup>III</sup> example displaying an anisotropy barrier of 23 cm<sup>-1</sup>. The Cr<sup>III</sup> complex displays a barrier of 28 cm<sup>-1</sup>, with longer relaxation times and open hysteresis loops, the latter of which is not seen in the Co<sup>III</sup> case. This is a consequence of strong Dy<sup>III</sup>-Cr<sup>III</sup> magnetic interactions, with the relaxation arising from the electronic structure of the whole complex and not from a single Dy<sup>III</sup> ion. The results suggest that the presence of strong exchange interactions lead to significantly longer relaxation times than in isostructural complexes where the exchange is weak. The study also suggests that electron-withdrawing groups on both bridging (carboxylate) and terminal (β-diketonate) ligands enhance the anisotropy barrier."
  image: "assets/publications/2015/Langley_IC_2015.png"

- title: Influencing the properties of dysprosium single-molecule magnets with phosphorus donor ligands
  authors:
    - T. Pugh
    - F. Tuna
    - L. Ungur
    - D. Collison
    - E. J. McInnes
    - L. F. Chibotaru
    - R. A. Layfield
  group_members:
    - L. Ungur
  year: "2015"
  journal: Nature Communications
  links:
    doi: 10.1038/ncomms8492
    pdf: "assets/publications/2015/Pugh_NC_2015.pdf"
    si: "assets/publications/2015/Pugh_NC_2015_SI.pdf"
    cif: "assets/publications/2015/Pugh_NC_2015.cif"
  abstract: "Single-molecule magnets are a type of coordination compound that can retain magnetic information at low temperatures. Single-molecule magnets based on lanthanides have accounted for many important advances, including systems with very large energy barriers to reversal of the magnetization, and a di-terbium complex that displays magnetic hysteresis up to 14 K and shows strong coercivity. Ligand design is crucial for the development of new single-molecule magnets: organometallic chemistry presents possibilities for using unconventional ligands, particularly those with soft donor groups. Here we report dysprosium single-molecule magnets with neutral and anionic phosphorus donor ligands, and show that their properties change dramatically when varying the ligand from phosphine to phosphide to phosphinidene. A phosphide-ligated, trimetallic dysprosium single-molecule magnet relaxes via the second-excited Kramers' doublet, and, when doped into a diamagnetic matrix at the single-ion level, produces a large energy barrier of 256 cm<sup>-1</sup> and magnetic hysteresis up to 4.4 K."
  image: "assets/publications/2015/Pugh_NC_2015.png"

- title: "Magnetic Relaxation in Single-Electron Single-Ion Cerium(III) Magnets: Insights from Ab Initio Calculations"
  authors:
    - S. K. Singh
    - T. Gupta
    - L. Ungur
    - G. Rajaraman
  group_members:
    - L. Ungur
  year: "2015"
  journal: Chemistry – A European Journal
  links:
    doi: 10.1002/chem.201501330
    pdf: "assets/publications/2015/Singh_CEJ_2015.pdf"
    si: "assets/publications/2015/Singh_CEJ_2015_SI.pdf"
  abstract: "Detailed ab initio calculations were performed on two structurally different cerium(III) single-molecule magnets (SMMs) to probe the origin of magnetic anisotropy and to understand the mechanism of magnetic relaxations. The complexes [Ce<sup>III</sup>{Zn<sup>II</sup>(L)}<sub>2</sub>(MeOH)]BPh<sub>4</sub> (<b>1</b>) and [Li(dme)<sub>3</sub>][Ce<sup>III</sup>(cot″)<sub>2</sub>] (<b>2</b>; L=N,N,O,O-tetradentate Schiff base ligand; DME=dimethoxyethane, COT″=1,4-bis(trimethylsilyl)cyclooctatetraenyldianion), which are reported to be zero-field and field-induced SMMs with effective barrier heights of 21.2 and 30 K respectively, were chosen as examples. CASSCF+RASSI/SINGLE_ANISO calculations unequivocally suggest that <i>m</i><sub>J</sub>|±5/2〉 and |±1/2〉 are the ground states for complexes <b>1</b> and <b>2</b>, respectively. The origin of these differences is rooted back to the nature of the ligand field and the symmetry around the cerium(III) ions. Ab initio magnetisation blockade barriers constructed for complexes <b>1</b> and <b>2</b> expose a contrasting energy-level pattern with significant quantum tunnelling of magnetisation between the ground state Kramers doublet in complex <b>2</b>. Calculations performed on several model complexes stress the need for a suitable ligand environment and high symmetry around the cerium(III) ions to obtain a large effective barrier."
  image: "assets/publications/2015/Singh_CEJ_2015.png"

- title: Tuning the Magnetic Interactions and Relaxation Dynamics of Dy<sub>2</sub> Single-Molecule Magnets
  authors:
    - S. Xue
    - Y. Guo
    - L. Ungur
    - J. Tang
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2015"
  journal: Chemistry – A European Journal
  links:
    doi: 10.1002/chem.201501866
    pdf: "assets/publications/2015/Xue_CEJ_2015.pdf"
    si: "assets/publications/2015/Xue_CEJ_2015_SI.pdf"
    cif: "assets/publications/2015/Xue_CEJ_2015.cif"
  abstract: "Efficient modulation of single-molecule magnet (SMM) behavior was realized by deliberate structural modification of the Dy<sub>2</sub> cores of [Dy<sub>2</sub>(a′povh)<sub>2</sub>(OAc)<sub>2</sub>(DMF)<sub>2</sub>] (<b>1</b>) and [Zn<sub>2</sub>Dy<sub>2</sub>(a′povh)<sub>2</sub>(OAc)<sub>6</sub>]⋅4H<sub>2</sub>O (<b>2</b>; H<sub>2</sub>a′povh=N′-[amino(pyrimidin-2-yl)methylene]-o-vanilloyl hydrazine). Compound <b>1</b> having fourfold linkage between the two dysprosium ions shows high-performance SMM behavior with a thermal energy barrier of 322.1 K, whereas only slow relaxation is observed for compound <b>2</b> with only twofold connection between the dysprosium ions. This remarkable discrepancy is mainly because of strong axiality in <b>1</b> due to one pronounced covalent bond, as revealed by experimental and theoretical investigations. The significant antiferromagnetic interaction derived from bis(μ<sub>2</sub>-O) and two acetate bridging groups was found to be crucial in leading to a nonmagnetic ground state in <b>1</b>, by suppressing zero-field quantum tunneling of magnetization."
  image: "assets/publications/2015/Xue_CEJ_2015.png"

- title: Desolvation-Driven 100-Fold Slow-down of Tunneling Relaxation Rate in Co(II)-Dy(III) Single-Molecule Magnets through a Single-Crystal-to-Single-Crystal Process
  authors:
    - J. L. Liu
    - J. Y. Wu
    - G. Z. Huang
    - Y. C. Chen
    - J. H. Jia
    - L. Ungur
    - L. F. Chibotaru
    - X. M. Chen
    - M. L. Tong
  group_members:
    - L. Ungur
  year: "2015"
  journal: Scientific Reports
  links:
    doi: 10.1038/srep16621
    pdf: "assets/publications/2015/Liu_SR_2015.pdf"
    si: "assets/publications/2015/Liu_SR_2015_SI.pdf"
    cif: "assets/publications/2015/Liu_SR_2015.cif"
  abstract: "Single-molecule magnets (SMMs) are regarded as a class of promising materials for spintronic and ultrahigh-density storage devices. Tuning the magnetic dynamics of single-molecule magnets is a crucial challenge for chemists. Lanthanide ions are not only highly magnetically anisotropic but also highly sensitive to the changes in the coordination environments. We developed a feasible approach to understand parts of the magneto-structure correlations and propose to regulate the relaxation behaviors via rational design. A series of Co<sup>II</sup>-Dy<sup>III</sup>-Co<sup>II</sup> complexes were obtained using in situ synthesis; in this system of complexes, the relaxation dynamics can be greatly improved, accompanied with desolvation, via single-crystal to single-crystal transformation. The effective energy barrier can be increased from 293 cm<sup>-1</sup> (422 K) to 416 cm<sup>-1</sup> (600 K) and the tunneling relaxation time can be grown from 8.5 × 10<sup>-4</sup> s to 7.4 × 10<sup>-2</sup> s. These remarkable improvements are due to the change in the coordination environments of Dy<sup>III</sup> and Co<sup>II</sup>. Ab initio calculations were performed to better understand the magnetic dynamics."
  image: "assets/publications/2015/Liu_SR_2015.png"

- title: Probing the structural and magnetic properties of a new family of centrosymmetric dinuclear lanthanide complexes
  authors:
    - Y. Jiang
    - R. J. Holmberg
    - F. Habib
    - L. Ungur
    - I. Korobkov
    - L. F. Chibotaru
    - M. Murugesu
  group_members:
