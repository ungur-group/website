  abstract: "Two ways to relax: A defect-dicubane Co<sub>2</sub>Dy<sub>2</sub> single-molecule magnet (SMM) displays slow relaxation of magnetization with a blocking temperature of 22 K (at 1500 Hz), the highest reported for a 3d–4f-based SMM. Analysis of the relaxation reveals two distinct blocking regimes, one of which is intraionic, localized on the Dy<sup>III</sup> ions, while the other is exchange-based."
