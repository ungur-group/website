  abstract: "A gold-catalyzed post-Ugi ipso-cyclization for the diastereoselective synthesis of spirocyclic pyrrol-2-onedienone system is described. Tuning the catalytic system, solvent, and temperature allowed selectively attaining two sets of diastereoisomers. The scope of the process has been evaluated, and a putative mechanistic model was proposed."
