  year: "2014"
  journal: Scientific Reports
  links:
    doi: 10.1038/srep05471
    pdf: "assets/publications/2014/Guo_SR_2014.pdf"
    si: "assets/publications/2014/Guo_SR_2014_SI.pdf"
  abstract: "Single-molecule magnets are compounds that exhibit magnetic bistability purely of molecular origin. The control of anisotropy and suppression of quantum tunneling to obtain a comprehensive picture of the relaxation pathway manifold, is of utmost importance with the ultimate goal of slowing the relaxation dynamics within single-molecule magnets to facilitate their potential applications. Combined ab initio calculations and detailed magnetization dynamics studies reveal the unprecedented relaxation mediated via the second excited state within a new DyNCN system comprising a valence-localized carbon coordinated to a single dysprosium(III) ion. The essentially C2v symmetry of the Dy<sup>III</sup> ion results in a new relaxation mechanism, hitherto unknown for mononuclear Dy<sup>III</sup> complexes, opening new perspectives for means of enhancing the anisotropy contribution to the spin-relaxation barrier."
  image: "assets/publications/2014/Guo_SR_2014.png"

