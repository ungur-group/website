  abstract: "Three new binuclear Fe<sup>III</sup>–Ln<sup>III</sup> complexes, with similar structures, have been synthesized using the end-off compartmental proligand, H<sub>2</sub>valpn, resulting from the Schiff condensation between o-vanillin and 1,3-propylenediamine: [Fe<sup>III</sup>Ln<sup>III</sup>(valpn)(hfac)<sub>2</sub>(OAc)Cl] (Ln = Gd, Tb, Dy; hfac<sup>−</sup> = hexafluoroacetylacetonate; AcO<sup>−</sup> = acetate). The metal ions are triply bridged by two phenoxido oxygen atoms and by the acetato ligand (syn–syn bridging mode). Among all these compounds the Fe<sup>III</sup>–Ln<sup>III</sup> exchange interaction was found to be ferromagnetic (<i>J</i><sub>FeGd</sub> = +1.004(4) cm<sup>-1</sup>; <i>H</i> = −<i>J</i><i>S</i><sub>Fe</sub><i>S</i><sub>Gd</sub>). The [Fe<sup>III</sup>Dy<sup>III</sup>] derivative shows field-induced slow relaxation of the magnetization. The interpretation of the magnetic properties for the [Fe<sup>III</sup>Gd<sup>III</sup>], [Fe<sup>III</sup>Tb<sup>III</sup>] and [Fe<sup>III</sup>Dy<sup>III</sup>] is done through ab initio calculations. It was concluded that the temperature behavior of the relaxation time in the [Fe<sup>III</sup>Dy<sup>III</sup>] derivative is due to dominant Orbach relaxation processes between states at the opposite sides and opposite heights of the blocking barrier. From this understanding, the relaxation mechanism for similar systems where a transition metal is in exchange coupling with a strong anisotropic lanthanide ion is elucidated, which could provide a strategy to synthesize other binuclear complexes with better magnetic properties."
  image: "assets/publications/2021/Andruh_J_Mat_Chem_C_2021.png"

- title: Exploring vibronic coupling in the benzene radical cation and anion with different levels of the <i>GW</i> approximation
  authors:
    - Z. C. Wong
    - L. Ungur
  group_members:
    - L. Ungur
  year: "2021"
  journal: Physical Chemistry Chemical Physics
  links:
    doi: 10.1039/D1CP02795F
    pdf: "assets/publications/2021/Wong_PCCP_2021.pdf"
    si: "assets/publications/2021/Wong_PCCP_2021_SI.pdf"
  abstract: "The linear vibronic coupling constants of the benzene radical cation and anion have been obtained with different levels of the GW approximation, including G<sub>0</sub>W<sub>0</sub>, eigenvalue self-consistent GW, and quasiparticle self-consistent GW, as well as DFT with the following exchange–correlation functionals: BLYP, B3LYP, CAM-B3LYP, tuned CAM-B3LYP, and an IP-tuned CAM-B3LYP functional. The vibronic coupling constants were calculated numerically using the gradients of the eigenvalues of the degenerate HOMOs and LUMOs of the neutral benzene molecule for DFT, while the numerical gradients of the quasiparticle energies were used in the case of GW. The results were evaluated against those of high level wave function methods in the literature, and the approximate self-consistent GW methods and G<sub>0</sub>W<sub>0</sub> with long-range corrected functionals were found to yield the best results on the whole."
  image: "assets/publications/2021/Wong_PCCP_2021.png"

- title: "Towards understanding the magnetism of Os(iv) complexes: an <i>ab initio</i> insight"
  authors:
    - L. Ungur
    - K. Pallitsch
    - Z. A. AlOthman
    - A. A. S. Al-Kahtani
    - V. B. Arion
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2021"
  journal: Dalton Transactions
  links:
    doi: 10.1039/D1DT01558C
    pdf: "assets/publications/2021/Ungur_DT_2021.pdf"
    si: "assets/publications/2021/Ungur_DT_2021_SI.pdf"
  abstract: "The magnetism of a recently synthesized trans-[Os<sup>IV</sup>Cl<sub>4</sub>(κN<sup>1</sup>-Hind)<sub>2</sub>] complex (5d<sup>4</sup>-system), where Hind = 2H-indazole, was studied experimentally and theoretically. Relativistic CASSCF/CASPT2 calculations for this and model [Os<sup>IV</sup>Cl<sub>6</sub>]<sup>2−</sup> complexes were employed to understand the nature of the low-lying multiplets. It is found that despite strong metal–ligand covalency they are basically characterized by the total angular pseudo-momentum <i>J</i>̃ originating from the spin–orbit coupling of the ground-state spin <i>S</i> = 1 with the orbital pseudo-momentum <i>L</i>̃ = 1 of the Os<sup>IV</sup> ion. The strong spin–orbit interaction also preserves the dominant <i>J</i>̃ = 0 character of the non-magnetic ground state in the trans-[Os<sup>IV</sup>Cl<sub>4</sub>(κN<sup>1</sup>-Hind)<sub>2</sub>] complex despite significant deviation of the ligand environment of Os<sup>IV</sup> from octahedral symmetry. At the same time the spin–orbit admixture of all multiplets arising from the t<sub>2g</sub><sup>4</sup> strong-field electronic configuration is indispensable for the correct description of magnetic properties of Os<sup>IV</sup> complexes. Moreover, based on ab initio calculations, we argue that the charge-transfer states play an important role in the magnetism of the present and probably other 5d complexes, a situation never encountered for 3d and 4f compounds."
  image: "assets/publications/2021/Ungur_DT_2021.png"

- title: Magnetization Dynamics on Isotope-Isomorphic Holmium Single-Molecule Magnets
  authors:
    - Y. Liu
    - L. T. A. Ho
    - G. Huang
    - Y. Chen
    - L. Ungur
    - J. Liu
    - M. Tong
  group_members:
