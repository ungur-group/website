  year: "2014"
  journal: Chem. Sci.
  links:
    doi: 10.1039/C3SC53044B
    pdf: "assets/publications/2014/Pedersen_CS_2014.pdf"
    si: "assets/publications/2014/Pedersen_CS_2014_SI.pdf"
    cif: "assets/publications/2014/Pedersen_CS_2014.cif"
  abstract: "We study the ligand-field splittings and magnetic properties of three Er<sup>III</sup> single-ion magnets which differ in the peripheral ligand sphere but exhibit similar first coordination spheres by inelastic neutron scattering (INS) and SQUID magnetometry. The INS spectra of the three compounds are profoundly different pointing at a strong response of the magnetic behavior to minor structural changes, as they are e.g. encountered when depositing molecules on surfaces. The observation of several magnetic excitations within the <i>J</i> = 15/2 ground multiplet together with single-crystal magnetic measurements allows for the extraction of the sign and magnitude of all symmetry-allowed Stevens parameters. The parameter values and the energy spectrum derived from INS are compared to the results of state-of-the-art ab initio CASSCF calculations. Temperature-dependent alternating current (ac) susceptibility measurements suggest that the magnetisation relaxation in the investigated temperature range of 1.9 K < <i>T</i> < 5 K is dominated by quantum tunnelling of magnetisation and two-phonon Raman processes. The possibility of observing electron paramagnetic resonance transitions between the ground-state doublet states, which can be suppressed in perfectly axial single-ion magnets, renders the studied systems interesting as representations of quantum bits."
  image: "assets/publications/2014/Pedersen_CS_2014.png"

- title: Spectroscopic determination of crystal field splittings in lanthanide double deckers
  authors:
    - R. Marx
    - F. Moro
    - M. Dörfel
