- title: Zeeman interaction and Jahn-Teller effect in the Γ 8 multiplet
  authors:
    - N. Iwahara
    - V. Vieru
    - L. Ungur
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2017"
  journal: Physical Review B
  links:
    doi: 10.1103/PhysRevB.96.064416
    pdf: "assets/publications/2017/Iwahara_PRB_2017.pdf"
    si: "assets/publications/2017/Iwahara_PRB_2017_SI.txt"
  abstract: "We present a thorough analysis of the interplay of magnetic moment and the Jahn-Teller effect in the Γ8 cubic multiplet. We find that in the presence of the dynamical Jahn-Teller effect, the Zeeman interaction remains isotropic, whereas the <i>g</i> and <i>G</i> factors can change their signs. The static Jahn-Teller distortion also can change the sign of these <i>g</i> factors as well as the nature of the magnetic anisotropy. Combining the theory with state-of-the-art ab initio calculations, we analyzed the magnetic properties of Np<sup>4+</sup> and Ir<sup>4+</sup> impurity ions in a cubic environment. The calculated <i>g</i> factors of the Np<sup>4+</sup> impurity agree well with experimental data. The ab initio calculation predicts a strong Jahn-Teller effect in Ir<sup>4+</sup> ion in the cubic environment and the strong vibronic reduction of <i>g</i> and <i>G</i> factors."
  image: "assets/publications/2017/Iwahara_PRB_2017.png"

