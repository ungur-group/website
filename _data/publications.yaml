  abstract: "We present the in-depth determination of the magnetic properties and electronic structure of the luminescent and volatile dysprosium-based single molecule magnet [Dy<sub>2</sub>(bpm)(fod)<sub>6</sub>] (Hfod = 6,6,7,7,8,8,8-heptafluoro-2,2-dimethyl-3,5-octanedione, bpm = 2,2′-bipyrimidine). Ab initio calculations were used to obtain a global picture of the electronic structure and to predict possible single molecule magnet behaviour, confirmed by experiments. The orientation of the susceptibility tensor was determined by means of cantilever torque magnetometry. An experimental determination of the electronic structure of the lanthanide ion was obtained combining Luminescence, Far Infrared and Magnetic Circular Dichroism spectroscopies. Fitting these energies to the full single ion plus crystal field Hamiltonian allowed determination of the eigenstates and crystal field parameters of a lanthanide complex without symmetry idealization. We then discuss the impact of a stepwise symmetry idealization on the modelling of the experimental data. This result is particularly important in view of the misleading outcomes that are often obtained when the symmetry of lanthanide complexes is idealized."
  image: "assets/publications/2019/Perfetti_CS_2019.png"

- title: Single Crystal Investigations Unravel the Magnetic Anisotropy of the “Square-In Square” Cr4Dy4 SMM Coordination Cluster
  authors:
    - M. Perfetti
    - J. Rinck
    - G. Cucinotta
    - C. E. Anson
    - X. Gong
    - L. Ungur
    - L. Chibotaru
    - M. E. Boulon
    - A. K. Powell
    - R. Sessoli
  group_members:
    - L. Ungur
  year: "2019"
  journal: Frontiers in Chemistry
  links:
    doi: 10.3389/fchem.2019.00006
    pdf: "assets/publications/2019/Perfetti_FrontChem_2019.pdf"
    si: "assets/publications/2019/Perfetti_FrontChem_2019_SI.pdf"
  abstract: "In the search for new single molecule magnets (SMM), i.e., molecular systems that can retain their magnetization without the need to apply an external magnetic field, a successful strategy is to associate 3d and 4f ions to form molecular coordination clusters. In order to efficiently design such systems, it is necessary to chemically project both the magnetic building blocks and the resultant interaction before the synthesis. Lanthanide ions can provide the required easy axis magnetic anisotropy that hampers magnetization reversal. In the rare examples of 3d/4f SMMs containing Cr<sup>III</sup> ions, the latter turn out to act as quasi-isotropic anchors which can also interact via 3d-4f coupling to neighbouring Ln centres. This has been demonstrated in cases where the intramolecular exchange interactions mediated by Cr<sup>III</sup> ions effectively reduce the efficiency of tunnelling without applied magnetic field. However, describing such high nuclearity systems remains challenging, from both experimental and theoretical perspectives, because the overall behaviour of the molecular cluster is heavily affected by the orientation of the individual anisotropy axes. These are in general non-collinear to each other. In this article, we combine single crystal SQUID and torque magnetometry studies of the octanuclear [Cr<sub>4</sub>Dy<sub>4</sub>(µ<sub>3</sub>-OH)<sub>4</sub>(µ-N<sub>3</sub>)<sub>4</sub>(mdea)<sub>4</sub>(piv)<sub>8</sub>]·3CH<sub>2</sub>Cl<sub>2</sub> single molecule magnet (piv=pivalate and mdea=N-methyldiethanol amine). These experiments allowed us to probe the magnetic anisotropy of this complex which displays slow magnetization dynamics due to the peculiar arrangement of the easy-axis anisotropy on the Dy sites. New ab initio calculations considering the entire cluster are in agreement with our experimental results."
  image: "assets/publications/2019/Perfetti_FrontChem_2019.png"

