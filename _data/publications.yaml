    si: "assets/publications/2025/Francis_CC_2025_SI.pdf"
    cif: "assets/publications/2025/Francis_CC_2025.cif"
  abstract: "Two novel atomically precise tetra-nuclear cobalt clusters (<b>3a</b>–<b>3b</b>) having a Co<sup>II</sup><sub>4</sub>O core with 3-fold symmetry, and three short Co–Co distances of 2.7046(4) Å are isolated with three chelating NP-donor mono-anionic ligands. <b>3a</b>–<b>3b</b> are shown to react with O<sub>2</sub>, producing dinuclear cobalt complexes (<b>4a</b>–<b>4b</b>), where the P-centres of the ligands are oxygenated. All complexes are structurally characterized by single-crystal X-ray diffraction, and further studied by UV-vis, IR spectroscopy, CV, magnetic susceptibility measurements, and DFT calculations."
