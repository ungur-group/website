  journal: Journal of Computational Chemistry
  links:
    doi: 10.1002/jcc.24221
    pdf: "assets/publications/2016/Aquilante_JCC_2016.pdf"
    si: "assets/publications/2016/Aquilante_JCC_2016_SI.pdf"
  abstract: "In this report, we summarize and describe the recent unique updates and additions to the Molcas quantum chemistry program suite as contained in release version 8. These updates include natural and spin orbitals for studies of magnetic properties, local and linear scaling methods for the Douglas–Kroll–Hess transformation, the generalized active space concept in MCSCF methods, a combination of multiconfigurational wave functions with density functional theory in the MC-PDFT method, additional methods for computation of magnetic properties, methods for diabatization, analytical gradients of state average complete active space SCF in association with density fitting, methods for constrained fragment optimization, large-scale parallel multireference configuration interaction including analytic gradients via the interface to the Columbus package, and approximations of the CASPT2 method to be used for computations of large systems. In addition, the report includes the description of a computational machinery for nonlinear optical spectroscopy through an interface to the QM/MM package Cobramm. Further, a module to run molecular dynamics simulations is added, two surface hopping algorithms are included to enable nonadiabatic calculations, and the DQ method for diabatization is added. Finally, we report on the subject of improvements with respects to alternative file options and parallelization. © 2015 Wiley Periodicals, Inc."
  image: "assets/publications/2016/Aquilante_JCC_2016.png"

- title: Symmetry-Supported Magnetic Blocking at 20 K in Pentagonal Bipyramidal Dy(III) Single-Ion Magnets
  authors:
    - Y. C. Chen
    - J. L. Liu
    - L. Ungur
    - J. Liu
    - Q. W. Li
    - L. F. Wang
    - Z. P. Ni
    - L. F. Chibotaru
    - X. M. Chen
    - M. L. Tong
  group_members:
    - L. Ungur
  year: "2016"
  journal: Journal of the American Chemical Society
  links:
    doi: 10.1021/jacs.5b13584
    pdf: "assets/publications/2016/Chen_JACS_2016.pdf"
    si: "assets/publications/2016/Chen_JACS_2016_SI.pdf"
    cif: "assets/publications/2016/Chen_JACS_2016.cif"
  abstract: "Single-molecule magnets (SMMs) that can be trapped in one of the bistable magnetic states separated by an energy barrier are among the most promising candidates for high-density information storage, quantum processing, and spintronics. To date, a considerable series of achievements have been made. However, the presence of fast quantum tunnelling of magnetization (QTM) in most SMMs, especially in single-ion magnets (SIMs), provides a rapid relaxation route and often sets up a limit for the relaxation time. Here, we pursue the pentagonal bipyramidal symmetry to suppress the QTM and present pentagonal bipyramidal Dy<sup>III</sup> SIMs [Dy(Cy<sub>3</sub>PO)<sub>2</sub>(H<sub>2</sub>O)<sub>5</sub>]Cl<sub>3</sub>·(Cy<sub>3</sub>PO)·H<sub>2</sub>O·EtOH (<b>1</b>) and [Dy(Cy<sub>3</sub>PO)<sub>2</sub>(H<sub>2</sub>O)<sub>5</sub>]Br<sub>3</sub>·2(Cy<sub>3</sub>PO)·2H<sub>2</sub>O·2EtOH (<b>2</b>), (Cy<sub>3</sub>PO = tricyclohexyl phosphine oxide). Magnetic characterizations reveal their fascinating SMM properties with high energy barriers as 472(7) K for <b>1</b> and 543(2) K for <b>2</b>, along with a record magnetic hysteresis temperature up to 20 K for <b>2</b>. These results, combined with the ab initio calculations, offer an illuminating insight into the vast possibility and potential of what the symmetry rules can achieve in molecular magnetism."
  image: "assets/publications/2016/Chen_JACS_2016.png"

- title: Giant exchange interaction in mixed lanthanides
  authors:
    - V. Vieru
    - N. Iwahara
    - L. Ungur
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2016"
  journal: Scientific Reports
  links:
    doi: 10.1038/srep24046
    pdf: "assets/publications/2016/Vieru_SR_2016.pdf"
    si: "assets/publications/2016/Vieru_SR_2016_SI.pdf"
    cif: "assets/publications/2016/Vieru_SR_2016.cif"
  abstract: "Combining strong magnetic anisotropy with strong exchange interaction is a long standing goal in the design of quantum magnets. The lanthanide complexes, while exhibiting a very strong ionic anisotropy, usually display a weak exchange coupling, amounting to only a few wavenumbers. Recently, an isostructural series of mixed (Ln = Gd, Tb, Dy, Ho, Er) have been reported, in which the exchange splitting is estimated to reach hundreds wavenumbers. The microscopic mechanism governing the unusual exchange interaction in these compounds is revealed here by combining detailed modeling with density-functional theory and ab initio calculations. We find it to be basically kinetic and highly complex, involving non-negligible contributions up to seventh power of total angular momentum of each lanthanide site. The performed analysis also elucidates the origin of magnetization blocking in these compounds. Contrary to general expectations the latter is not always favored by strong exchange interaction."
  image: "assets/publications/2016/Vieru_SR_2016.png"

- title: A Stable Pentagonal Bipyramidal Dy(III) Single-Ion Magnet with a Record Magnetization Reversal Barrier over 1000 K
  authors:
    - J. Liu
    - Y. C. Chen
    - J. L. Liu
    - V. Vieru
    - L. Ungur
    - J. H. Jia
    - L. F. Chibotaru
    - Y. Lan
    - W. Wernsdorfer
    - S. Gao
    - X. M. Chen
    - M. L. Tong
  group_members:
    - L. Ungur
  year: "2016"
  journal: Journal of the American Chemical Society
  links:
    doi: 10.1021/jacs.6b02638
    pdf: "assets/publications/2016/Liu_JACS_2016.pdf"
    si: "assets/publications/2016/Liu_JACS_2016_SI.pdf"
    cif: "assets/publications/2016/Liu_JACS_2016.cif"
  abstract: "Single-molecule magnets (SMMs) with a large spin reversal barrier have been recognized to exhibit slow magnetic relaxation that can lead to a magnetic hysteresis loop. Synthesis of highly stable SMMs with both large energy barriers and significantly slow relaxation times is challenging. Here, we report two highly stable and neutral Dy<sup>III</sup> classical coordination compounds with pentagonal bipyramidal local geometry that exhibit SMM behavior. Weak intermolecular interactions in the undiluted single crystals are first observed for mononuclear lanthanide SMMs by micro-SQUID measurements. The investigation of magnetic relaxation reveals the thermally activated quantum tunneling of magnetization through the third excited Kramers doublet, owing to the increased axial magnetic anisotropy and weaker transverse magnetic anisotropy. As a result, pronounced magnetic hysteresis loops up to 14 K are observed, and the effective energy barrier (<i>U</i><sub>eff</sub> = 1025 K) for relaxation of magnetization reached a breakthrough among the SMMs."
  image: "assets/publications/2016/Liu_JACS_2016.png"

- title: The active site of low-temperature methane hydroxylation in iron-containing zeolites
  authors:
    - B. E. R. Snyder
    - P. Vanelderen
    - M. L. Bols
    - S. D. Hallaert
    - L. H. Böttger
    - L. Ungur
    - K. Pierloot
    - R. A. Schoonheydt
    - B. F. Sels
    - E. I. Solomon
  group_members:
    - L. Ungur
  year: "2016"
  journal: Nature
  links:
    doi: 10.1038/nature19059
    pdf: "assets/publications/2016/Snyder_Nature_2016.pdf"
    si: "assets/publications/2016/Snyder_Nature_2016_SI.pdf"
  abstract: "An efficient catalytic process for converting methane into methanol could have far-reaching economic implications. Iron-containing zeolites (microporous aluminosilicate minerals) are noteworthy in this regard, having an outstanding ability to hydroxylate methane rapidly at room temperature to form methanol. Reactivity occurs at an extra-lattice active site called α-Fe(ii), which is activated by nitrous oxide to form the reactive intermediate α-O; however, despite nearly three decades of research, the nature of the active site and the factors determining its exceptional reactivity are unclear. The main difficulty is that the reactive species—α-Fe(ii) and α-O—are challenging to probe spectroscopically: data from bulk techniques such as X-ray absorption spectroscopy and magnetic susceptibility are complicated by contributions from inactive ‘spectator’ iron. Here we show that a site-selective spectroscopic method regularly used in bioinorganic chemistry can overcome this problem. Magnetic circular dichroism reveals α-Fe(ii) to be a mononuclear, high-spin, square planar Fe(ii) site, while the reactive intermediate, α-O, is a mononuclear, high-spin Fe(iv)=O species, whose exceptional reactivity derives from a constrained coordination geometry enforced by the zeolite lattice. These findings illustrate the value of our approach to exploring active sites in heterogeneous systems. The results also suggest that using matrix constraints to activate metal sites for function—producing what is known in the context of metalloenzymes as an ‘entatic’ state—might be a useful way to tune the activity of heterogeneous catalysts."
  image: "assets/publications/2016/Snyder_Nature_2016.png"

- title: Strategies toward High-Temperature Lanthanide-Based Single-Molecule Magnets
  authors:
    - L. Ungur
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2016"
  journal: Inorganic Chemistry
  links:
    doi: 10.1021/acs.inorgchem.6b01353
    pdf: "assets/publications/2016/Ungur_IC_2016.pdf"
  abstract: "Lanthanide-based single-molecule magnets are leading materials for achieving magnetization blocking at the level of one molecule. In this paper, we examine the physical requirements for efficient magnetization blocking in single-ion complexes and identify the design principles for achieving very high magnetization blocking barriers in lanthanide-based compounds. The key condition is the preponderant covalent binding of the Ln ion to one of the ligand atoms, tremendously enhancing the axial crystal field. We also make an overview of practical schemes for the implementation of this principle. These are (1) the effective lowering of the coordination number via displacement of the Ln ion to one of the atoms in the coordination polyhedron, (2) the design of two-coordinated complexes, and (3) the stabilization of diatomic compounds in cages and on surfaces. The last proposal is appealing in connection to spintronics applications, especially via the exploration of robust and highly anisotropic [LnX] units displaying multilevel blocking barriers of thousands of Kelvin and prospects for room-temperature magnetization blocking."
  image: "assets/publications/2016/Ungur_IC_2016.png"

- title: "Synthesis, Crystal Structures, Magnetic Properties, and Theoretical Investigation of a New Series of Ni<sup>II</sup> –Ln<sup>III</sup> –W<sup>V</sup> Heterotrimetallics: Understanding the SMM Behavior of Mixed Polynuclear Complexes"
  authors:
    - V. Vieru
    - T. D. Pasatoiu
    - L. Ungur
    - E. Suturina
    - A. M. Madalan
    - C. Duhayon
    - J. P. Sutter
    - M. Andruh
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2016"
  journal: Inorganic Chemistry
  links:
    doi: 10.1021/acs.inorgchem.6b01669
    pdf: "assets/publications/2016/Vieru_IC_2016.pdf"
    si: "assets/publications/2016/Vieru_IC_2016_SI.pdf"
    cif: "assets/publications/2016/Vieru_IC_2016.cif"
  abstract: "The polynuclear compounds containing anisotropic metal ions often exhibit efficient barriers for blocking of magnetization at fairly arbitrary geometries. However, at variance with mononuclear complexes, which usually become single-molecule magnets (SMM) under the sole requirement of a highly axial crystal field at the metal ion, the factors influencing the SMM behavior in polynuclear complexes, especially, with weakly axial magnetic ions, still remain largely unrevealed. As an attempt to clarify these conditions, we present here the synthesis, crystal structures, magnetic behavior, and ab initio calculations for a new series of Ni<sup>II</sup>-Ln<sup>III</sup>-W<sup>V</sup> trimetallics, [(CN)<sub>7</sub>W(CN)Ni(H<sub>2</sub>O)(valpn)Ln(H<sub>2</sub>O)<sub>4</sub>]·H<sub>2</sub>O (Ln = Y <b>1</b>, Eu <b>2</b>, Gd <b>3</b>, Tb <b>4</b>, Dy <b>5</b>, Lu <b>6</b>). The surprising finding is the absence of the magnetic blockage even for compounds involving strongly anisotropic Dy<sup>III</sup> and Tb<sup>III</sup> metal ions. This is well explained by ab initio calculations showing relatively large transversal components of the g-tensor in the ground exchange Kramers doublets of <b>1</b> and <b>4</b> and large intrinsic tunneling gaps in the ground exchange doublets of <b>3</b> and <b>5</b>. In order to get more insight into this behavior, another series of earlier reported compounds with the same trinuclear [W<sup>V</sup>Ni<sup>II</sup>Ln<sup>III</sup>] core structure, [(CN)<sub>7</sub>W(CN)Ni(dmf)(valdmpn)Ln(dmf)<sub>4</sub>]·H<sub>2</sub>O (Ln = Gd<sup>III</sup> <b>7</b>, Tb<sup>III</sup> <b>8a</b>, Dy<sup>III</sup> <b>9</b>, Ho<sup>III</sup> <b>10</b>), [(CN)<sub>7</sub>W(CN)Ni(H<sub>2</sub>O)(valdmpn)Tb(dmf)<sub>2.5</sub>(H<sub>2</sub>O)<sub>1.5</sub>]·H<sub>2</sub>O·0.5dmf <b>8b</b>, and [(CN)<sub>7</sub>W(CN)Ni(H<sub>2</sub>O)(valdmpn)Er(dmf)<sub>3</sub>(H<sub>2</sub>O)<sub>1</sub>]·H<sub>2</sub>O·0.5dmf <b>11</b>, has been also investigated theoretically. In this series, only <b>8b</b> exhibits SMM behavior which is confirmed by the present ab initio calculations. An important feature for the entire series is the strong ferromagnetic coupling between Ni<sup>II</sup> and W<sup>V</sup>, which is due to an almost perfect trigonal dodecahedron geometry of the octacyano wolframate fragment. The reason why only <b>8b</b> is an SMM is explained by positive zero-field splitting on the nickel site, precluding magnetization blocking in complexes with fewer axial Ln ions. Further analysis has shown that, in the absence of ZFS on Ni ion, all compounds in the two series (except those containing Y and Gd) would be SMMs. The same situation arises for perfectly axial ZFS on Ni<sup>II</sup> with the main anisotropy axis parallel to the main magnetic axis of Ln<sup>III</sup> ions. In all other cases the ZFS on Ni<sup>II</sup> will worsen the SMM properties. The general conclusion is that the design of efficient SMMs on the basis of such complexes should involve isotropic or weekly anisotropic metal ions, such as Mn<sup>II</sup>, Fe<sup>III</sup>, etc., along with strongly axial lanthanides."
  image: "assets/publications/2016/Vieru_IC_2016.png"

- title: "Cycloheptatrienyl trianion: an elusive bridge in the search of exchange coupled dinuclear organolanthanide single-molecule magnets"
  authors:
    - K. L. M. Harriman
    - J. J. Le Roy
    - L. Ungur
    - R. J. Holmberg
    - I. Korobkov
    - M. Murugesu
  group_members:
    - L. Ungur
  year: "2017"
  journal: Chemical Science
  links:
    doi: 10.1039/C6SC01224H
    pdf: "assets/publications/2017/Harriman_CS_2017.pdf"
    si: "assets/publications/2017/Harriman_CS_2017_SI.pdf"
    cif: "assets/publications/2017/Harriman_CS_2017.cif"
  abstract: "The preparation of η-cyclopentadienyl (η<sup>5</sup>-C<sub>5</sub>R<sub>5</sub>), η-arene (η<sup>6</sup>-C<sub>6</sub>R<sub>6</sub>), and η-cyclooctatetraenyl (η<sup>8</sup>-C<sub>8</sub>R<sub>8</sub>) bridging motifs are common in organometallic chemistry; however, the synthetic preparation of η-cycloheptatrienyl (η<sup>7</sup>-C<sub>7</sub>R<sub>7</sub>) bridging motifs has remained a synthetic challenge in 4f chemistry. To this end, we have developed a synthetic route towards a series of rare dinuclear organolanthanide inverse sandwich complexes containing the elusive η<sup>7</sup>-C<sub>7</sub>H<sub>7</sub> bridge. Herein, we present the structures and magnetic properties of the lanthanide inverse sandwich complexes [KLn<sub>2</sub>(C<sub>7</sub>H<sub>7</sub>)(N(SiMe<sub>3</sub>)<sub>2</sub>)<sub>4</sub>] (Ln = Gd<sup>III</sup> (<b>1</b>), Dy<sup>III</sup> (<b>2</b>), Er<sup>III</sup> (<b>3</b>)) and [K(THF)<sub>2</sub>Er<sub>2</sub>(C<sub>7</sub>H<sub>7</sub>)(N(SiMe<sub>3</sub>)<sub>2</sub>)<sub>4</sub>] (<b>4</b>). These compounds are the first single-molecule magnets (SMMs) to feature this type of bridging motif. Furthermore, η<sup>7</sup>-C<sub>7</sub>H<sub>7</sub> was found to efficiently promote ferromagnetic exchange interactions between metal ions. Variable temperature dc magnetic susceptibility measurements and subsequent simulations give significant exchange constants of <i>J</i> = +1.384, +1.798, and +3.149 cm<sup>-1</sup> and dipolar constants of <i>J</i> = −0.603, −0.601, and −0.475 cm<sup>-1</sup> for compounds <b>2</b>–<b>4</b>, respectively. Frequency dependent ac susceptibility measurements under an applied static field resulted in the observation of dual relaxation processes, and brought forth a greater understanding of the intermolecularly driven process at high frequency. In particular, this type of analysis of compound <b>3</b> under 800 Oe elicited an energy barrier of <i>U</i><sub>eff</sub> = 58 K. Ab initio calculations were performed in order to understand the nature of magnetic coupling and the origin of slow relaxation of magnetisation. Through these studies, the effect of the amido ancillary ligands on the magnetic axiality of the lanthanide ions was found to be competitive with the crystal field of the η<sup>7</sup>-C<sub>7</sub>H<sub>7</sub> π-electron cloud. Our findings suggest that the tunability of the dipolar and exchange components of the magnetic interactions lie within the dihedral angle imposed by the amido ligands, thus offering potential for the development of new exchange coupled lanthanide systems."
  image: "assets/publications/2017/Harriman_CS_2017.png"

- title: "Pursuit of Record Breaking Energy Barriers: A Study of Magnetic Axiality in Diamide Ligated Dy<sup>III</sup> Single-Molecule Magnets"
  authors:
    - K. L. M. Harriman
    - J. L. Brosmer
    - L. Ungur
    - P. L. Diaconescu
    - M. Murugesu
  group_members:
    - L. Ungur
  year: "2017"
  journal: Journal of the American Chemical Society
  links:
    doi: 10.1021/jacs.6b12374
    pdf: "assets/publications/2017/Harriman_JACS_2017.pdf"
    si: "assets/publications/2017/Harriman_JACS_2017_SI.pdf"
  abstract: "Dy<sup>III</sup> single-ion magnets (SIMs) with strong axial donors and weak equatorial ligands are attractive model systems with which to harness the maximum magnetic anisotropy of Dy<sup>III</sup> ions. Utilizing a rigid ferrocene diamide ligand (NNTBS), a Dy<sup>III</sup> SIM, (NNTBS)DyI(THF)<sub>2</sub>, <b>1-Dy</b> (NNTBS = fc(NHSitBuMe<sub>2</sub>)<sub>2</sub>, fc = 1,1′-ferrocenediyl), composed of a near linear arrangement of donor atoms, exhibits a large energy barrier to spin reversal (770.8 K) and magnetic blocking (14 K). The effects of the transverse ligands on the magnetic and electronic structure of <b>1-Dy</b> were investigated through ab initio methods, eliciting significant magnetic axiality, even in the fourth Kramers doublet, thus demonstrating the potential of rigid diamide ligands in the design of new SIMs with defined magnetic axiality."
  image: "assets/publications/2017/Harriman_JACS_2017.png"

- title: Ab Initio Crystal Field for Lanthanides
  authors:
    - L. Ungur
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2017"
  journal: Chemistry – A European Journal
  links:
    doi: 10.1002/chem.201605102
    pdf: "assets/publications/2017/Ungur_CEJ_2017.pdf"
    si: "assets/publications/2017/Ungur_CEJ_2017_SI.pdf"
  abstract: "An ab initio methodology for the first-principle derivation of crystal-field (CF) parameters for lanthanides is described. The methodology is applied to the analysis of CF parameters in [Tb(Pc)<sub>2</sub>]<sup>−</sup> (Pc=phthalocyanine) and Dy<sub>4</sub>K<sub>2</sub> ([Dy<sub>4</sub>K<sub>2</sub>O(OtBu)<sub>12</sub>]) complexes, and compared with often used approximate and model descriptions. It is found that the application of geometry symmetrization, and the use of electrostatic point-charge and phenomenological CF models, lead to unacceptably large deviations from predictions based on ab initio calculations for experimental geometry. It is shown how the predictions of standard CASSCF (Complete Active Space Self-Consistent Field) calculations (with 4f orbitals in the active space) can be systematically improved by including effects of dynamical electronic correlation (CASPT2 step) and by admixing electronic configurations of the 5d shell. This is exemplified for the well-studied Er-trensal complex (H<sub>3</sub>trensal=2,2′,2“-tris(salicylideneimido)trimethylamine). The electrostatic contributions to CF parameters in this complex, calculated with true charge distributions in the ligands, yield less than half of the total CF splitting, thus pointing to the dominant role of covalent effects. This analysis allows the conclusion that ab initio crystal field is an essential tool for the decent description of lanthanides."
  image: "assets/publications/2017/Ungur_CEJ_2017.png"

- title: Dynamic Magnetic and Optical Insight into a High Performance Pentagonal Bipyramidal Dy<sup>III</sup> Single-Ion Magnet
