    pdf: "assets/publications/2012/Chibotaru_PRL_2012.pdf"
    si: "assets/publications/2012/Chibotaru_PRL_2012_SI.pdf"
  abstract: "It is shown that the sign of the product of three Zeeman splitting factors corresponding to the main magnetic axes defines the sign of the Berry phase of a (pseudo) spin in an applied magnetic field. <i>Ab initio</i> calculations show that <i>g</i><sub>X</sub><i>g</i><sub>Y</sub><i>g</i><sub>Z</sub> < 0 is often the case for lanthanide and transition metal complexes, while we prove that it is never achieved in <i>S</i> complexes with dominant second-order magnetic anisotropy. In the case of polynuclear compounds, it is argued that the signs of individual <i>g</i><sub>i</sub>, <i>i</i> = X, Y, Z, on each metal site can be extracted from experiment."
