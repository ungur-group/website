  abstract: "State-of-the-art <i>ab initio</i> calculations of a series of endohedral fullerenes Dy<sub><i>n</i></sub>Sc<sub>3-<i>n</i></sub>N@C<sub>80</sub> (<i>n</i> = 1, 2, 3) are performed, and their anisotropic magnetic properties are described from the first principles. Contrary to general expectation that molecules of higher nuclearity (<i>n</i>) exhibit better magnetic blocking properties, we predict Dy<sub>3</sub>N@C<sub>80</sub> to be a relatively weak single-molecule magnet due to its frustrated ground state. This finding, relevant to polynuclear magnetic molecules in general, demonstrates the crucial role played by magnetic frustration in the suppression of magnetization blocking in single-molecule magnets."
  image: "assets/publications/2013/Vieru_JPCL_2013.png"

- title: Modifying the properties of 4f single-ion magnets by peripheral ligand functionalisation
  authors:
