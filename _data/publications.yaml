- title: Manipulating the spin crossover behaviour in a series of cyanide-bridged {FeIII2FeII2} molecular squares through NCE<sup>-</sup> co-ligands
  authors:
    - M. You
    - G. T. Nguyen
    - D. Shao
    - T. Wang
    - X. Y. Chang
    - L. Ungur
    - Y. Z. Zhang
  group_members:
    - G. T. Nguyen
    - L. Ungur
  year: "2022"
  journal: Dalton Transactions
  links:
    doi: 10.1039/D2DT00058J
    pdf: "assets/publications/2022/You_DT_2022.pdf"
    si: "assets/publications/2022/You_DT_2022_SI.pdf"
    cif: "assets/publications/2022/You_DT_2022.cif"
  abstract: "Manipulating the transition temperature (<i>T</i><sub>1/2</sub>) of spin-crossover (SCO) complexes capable of fulfilling practical criteria through different synthetic strategies is one of the main focuses in the field of molecular magnetism. The reaction of the tricyanometallate precursor [(Tp*)Fe<sup>III</sup>(CN)<sub>3</sub>]<sup>−</sup> and Fe<sup>II</sup> salt with the “facially” tridentate ligand tris(2-pyridyl)phosphine oxide (TPPO) and NCE<sup>−</sup> anions afforded three isostructural {Fe<sup>III</sup><sub>2</sub>Fe<sup>II</sup><sub>2</sub>} square complexes {[(Tp*)Fe<sup>III</sup>(CN)<sub>3</sub>]<sub>2</sub>[Fe<sup>II</sup>(TPPO)]<sub>2</sub>[NCE]<sub>2</sub>}·Sol (E = S, Sol = 2CH<sub>3</sub>OH·6H<sub>2</sub>O, <b>1</b>; E = Se, Sol = 2MeCN·2CH<sub>2</sub>Cl<sub>2</sub>·2H<sub>2</sub>O, <b>2</b>; E = BH<sub>3</sub>, Sol = 4CH<sub>3</sub>OH·2MeCN, <b>3</b>). Detailed structural analysis, variable-temperature IR analysis, magnetic susceptibility measurements and DFT calculations revealed that all compounds exhibit complete and one-step SCO behaviour between the {Fe<sup>III</sup>,LS<sub>2</sub>Fe<sup>II</sup>,HS<sub>2</sub>} and {Fe<sup>III</sup>,LS<sub>2</sub>Fe<sup>II</sup>,LS<sub>2</sub>} electronic states. As the ligand field increases from NCS<sup>−</sup> to NCSe<sup>−</sup> to NCBH<sub>3</sub><sup>−</sup>, <i>T</i><sub>1/2</sub> shifts dramatically from 214 to 250 to 288 K for <b>1</b>, <b>2</b> and <b>3</b>, respectively, demonstrating another effective way to tune the SCO properties of the [Fe<sup>III</sup>–CN–Fe<sup>II</sup>] systems through the introduction of NCE<sup>−</sup> co-ligands."
  image: "assets/publications/2022/You_DT_2022.png"

- title: The Role of Radical Bridges in Polynuclear Single-Molecule Magnets
  authors:
    - G. T. Nguyen
    - L. Ungur
  year: "2022"
  journal: Chemistry – A European Journal
  group_members:
    - G. T. Nguyen
    - L. Ungur
  links:
    doi: 10.1002/chem.202200227
    pdf: "assets/publications/2022/Nguyen_CEJ_2022.pdf"
    si: "assets/publications/2022/Nguyen_CEJ_2022_SI.pdf"
  abstract: "Employing radical bridges between anisotropic metal ions has been a viable route to achieve high-performance single-molecule magnets (SMMs). While the bridges have been mainly considered for their ability to promote exchange interactions, the crystal-field effect arising from them has not been taken into account explicitly. This lack of consideration may distort the understanding and limit the development of the entire family. To shed light on this aspect, herein we report a theoretical investigation of a series of N<sub>2</sub><sup>3-</sup>-radical-bridged diterbium complexes. It is found that while promoting strong exchange coupling between the terbium ions, the N<sub>2</sub><sup>3-</sup>-radical induces a crystal field that interferes destructively with that of the outer ligands, and thus reduces the overall SMM behavior. Based on the theoretical results, we conclude that the SMM behavior in this series could be further maximized if the crystal field of the outer ligands is designed to be collinear with that of the radical bridge. This conclusion can be generalized to all exchange-coupled SMMs."
  image: "assets/publications/2022/Nguyen_CEJ_2022.png"

- title: Stable Triarylmethyl Radicals and Cobalt(II) Ions Based 1D/2D Coordination Polymers
  authors:
    - X. Hou
    - G. Truong Nguyen
    - T. Xu
    - H. Wei
    - T. Seng Herng
    - G. Huo
    - D. Wang
    - J. Ding
    - S. Wu
    - L. Ungur
    - J. Wu
  group_members:
    - L. Ungur
  year: "2022"
  journal: Chemistry – A European Journal
  links:
    doi: 10.1002/chem.202200687
    pdf: "assets/publications/2022/Hou_CEJ_2022.pdf"
    si: "assets/publications/2022/Hou_CEJ_2022_SI.pdf"
  abstract: "The incorporation of organic radicals into coordination polymers was considered as a promising strategy to promote metal-ligand exchange interactions, but there are only a very limited number of stable organic radical-based ligands that can serve well such a purpose. Herein, we report two new tris(2,4,6-trichlorophenyl)methyl (TTM) radical-based ligands L1 and L2 with two and three imidazole substituents, respectively. The imidazole unit serves as a coordination site and it can also stabilize the TTM radical by intramolecular donor–acceptor interaction. Coordination of L1 and L2 with cobalt(II) ions gave the corresponding one- (CoCP-1) and two-dimensional (CoCP-2) coordination polymers, the structures of which were confirmed by X-ray crystallographic analysis. Magnetic measurements and theoretical calculations suggest antiferromagnetic coupling between the paramagnetic cobalt(II) ions and the radical ligands. Our study provides a rational design for stable organic radical-based ligands and further demonstrated the feasibility of a metal–radical approach toward magnetic materials."
  image: "assets/publications/2022/Hou_CEJ_2022.png"

- title: "[Au<sup>I</sup> (CN)<sub>2</sub> ]-Armed [Fe<sup>III</sup><sub>2</sub> Fe<sup>II</sup><sub>2</sub> ] Square Complex Showing Unusual Spin-Crossover Behavior Due to a Symmetry-Breaking Phase Transition"
  authors:
    - M. You
    - D. Shao
    - Y. F. Deng
    - J. Yang
    - N. T. Yao
    - Y. S. Meng
    - L. Ungur
    - Y. Z. Zhang
  group_members:
    - L. Ungur
  year: "2022"
  journal: Inorganic Chemistry
  links:
    doi: 10.1021/acs.inorgchem.2c00192
    pdf: "assets/publications/2022/You_IC_2022.pdf"
    si: "assets/publications/2022/You_IC_2022_SI.pdf"
    cif: "assets/publications/2022/You_IC_2022.cif"
  abstract: "The incorporation of two different cyanide building blocks of [(TpR)Fe<sup>III</sup>(CN)<sub>3</sub>]<sup>-</sup> and [Au<sup>I</sup>(CN)<sub>2</sub>]<sup>-</sup> into one molecule afforded a novel hexanuclear [Fe<sup>III</sup><sub>2</sub>Fe<sup>II</sup><sub>2</sub>Au<sup>I</sup><sub>2</sub>] complex (<b>1</b>·2Et<sub>2</sub>O), in which the cyanide-bridged [Fe<sup>III</sup><sub>2</sub>Fe<sup>II</sup><sub>2</sub>] square was further grafted by two [Au<sup>I</sup>(CN)<sub>2</sub>]<sup>-</sup> fragments as long arms in syn orientations. Complex <b>1</b>·2Et<sub>2</sub>O undergoes a gradual spin crossover (SCO) from low-spin (LS) to high-spin (HS) state for the Fe<sup>II</sup> centers upon desolvation. Remarkably, its desolvated phase (<b>1</b>) exhibits a reversible but atypical two-step (sharp-gradual) SCO behavior with considerable hysteresis (21 K). Variable-temperature single-crystal X-ray structural studies reveal that the hysteretic spin transition takes place synchronously with the concerted displacive motions of the molecules, representing another rare example including multistep and hysteretic spin transitions due to the synergetic SCO and structural phase transition."
  image: "assets/publications/2022/You_IC_2022.png"

- title: "Mechanisms of Luminescence in Lanthanide Complexes: A Crucial Role of Metal–Ligand Covalency"
  authors:
    - L. Ungur
    - B. Szabo
    - Z. A. Alothman
    - A. A. S. Al-Kahtani
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2022"
  journal: Inorganic Chemistry
  links:
    doi: 10.1021/acs.inorgchem.2c00071
    pdf: "assets/publications/2022/Ungur_IC_2022.pdf"
    si: "assets/publications/2022/Ungur_IC_2022_SI.pdf"
  abstract: "A current understanding of the luminescence of lanthanide complexes is based on the phenomenological Judd–Ofelt (JO) theory. However, the mechanisms of electric-dipole transitions lying at its basis were never subjected to a rigorous analysis. Here, we investigate the contributions to the electric-dipole transitions in the Er<sup>3+</sup> <sup>4</sup>S<sub>3/2</sub> → <sup>4</sup>I<sub>15/2</sub> band of an erbium trensal complex using state-of-the-art ab initio calculations. We find that the conventional JO mechanism based on the electrostatic crystal field yields only a quarter of the integral intensity of this band. Accordingly, three quarters of it is contributed by covalent binding of erbium and ligand orbitals via three major mechanisms, the 4f ligand and ligand-ligand electric-dipole transitions and covalent enhancement of the hybridization of 4f and even empty orbitals of erbium. We expect that these findings will inspire the design of efficient rare-earth luminescent materials."
  image: "assets/publications/2022/Ungur_IC_2022.png"

- title: "Carbonate-free CoAl layered double hydroxides supercapacitors: Controlled precipitation via acid mediated decomplexation"
  authors:
    - X. Y. Tan
    - L. Ungur
    - W. S. Chin
  group_members:
    - L. Ungur
  year: "2022"
  journal: Applied Clay Science
  links:
    doi: 10.1016/j.clay.2022.106519
    pdf: "assets/publications/2022/Tan_Appl_Clay_Sci_2022.pdf"
    si: "assets/publications/2022/Tan_Appl_Clay_Sci_2022_SI.pdf"
  abstract: "Layered double hydroxides (LDH) belong to a class of highly versatile compounds used in a myriad of applications such as energy storage, catalysis, heavy metal adsorption, etc. Given the high tunability of its structure, ranging from different metal cations to different types of intercalations, LDH can be readily customised to suit the intended applications. One of the inherent problem of LDH lies in their carbonate contamination. The presence of CO<sub>3</sub><sup>2-</sup> anions in the intercalation greatly affects the versatility and tunability of LDH. Carbonate intercalation also poses as an interfering species for reactions involving carbonate as intermediates or final products. Unfortunately, existing synthesis procedures of LDH produce either carbonates during the precipitating process or poorly crystallised LDH that absorbs atmospheric carbon dioxide to form carbonates during the drying process; either way results in carbonate contaminated LDH. In this work, we address the problem with the use of ethylenediamine (EDA) complexation followed by controlled decomplexation to prepare CoAl LDH (LDH-EDA). It is shown that the obtained LDH-EDA is carbonate-free and outperforms the CoAl LDH obtained using conventional urea method (LDH-Urea) in terms of crystallinity, surface area and pseudocapacitive properties. Through a detailed experimental and computational study of the preparation mechanism, we propose that ammonium nitrate acts as an acid that mediates the decomplexation of the cobalt (II) trisethylenediamine complex, freeing Co<sup>2+</sup> ion in a control manner for the second precipitation process. The multistep process has allowed a controlled rate of formation of LDH, resulting in the highly crystalline LDH-EDA microstructures with pure nitrate intercalation and a flower-like morphology."
  image: "assets/publications/2022/Tan_Appl_Clay_Sci_2022.png"

