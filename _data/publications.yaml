- title: Record Quantum Tunneling Time in an Air-Stable Exchange-Bias Dysprosium Macrocycle
  authors:
    - Z. Zhu
    - S. Paul
    - C. Zhao
    - J. Wu
    - X. Ying
    - L. Ungur
    - W. Wernsdorfer
    - F. Meyer
    - J. Tang
  group_members:
    - L. Ungur
  year: "2024"
  journal: Journal of the American Chemical Society
  links:
    doi: 10.1021/jacs.4c07412
    pdf: "assets/publications/2024/Zhu_JACS_2024.pdf"
    si: "assets/publications/2024/Zhu_JACS_2024_SI.pdf"
    cif: "assets/publications/2024/Zhu_JACS_2024.cif"
  abstract: "In recent years, dysprosium macrocycle single-molecule magnets (SMMs) have received increasing attention due to their excellent air/thermal stability, strong magnetic anisotropy, and rigid molecular skeleton. However, they usually display fast zero-field quantum tunneling of the magnetization (QTM) rate, severely hindering their data storage applications. Herein, we report the design, synthesis, and characterization of an air-stable monodecker didysprosium macrocycle integrating strong single-ion anisotropy, near-perfect local crystal field (CF) symmetry, and efficient exchange bias. These indispensable features enable clear-cut elucidation of the crucial role of very weak antiferromagnetic coupling on magnetization dynamics, creating a prominent SMM with a large effective energy barrier (<i>U</i><sub>eff</sub>) of 670 cm<sup>-1</sup>, open hysteresis loops at zero field up to 14.9 K, and a record relaxation time of QTM (<i>τ</i><sub>QTM</sub>), 24281 s, for all known nonradical-bridged lanthanide SMMs."
  image: "assets/publications/2024/Zhu_JACS_2024.png"

- title: Modulating Static and Dynamic Magnetizations of Ytterbium(III) Coordination Polymers by Light-Induced Radicals
  authors:
    - X. Gou
    - Y. Wu
    - H. Wen
    - L. Li
    - W. Lan
    - N. Liu
    - S. Zhang
    - L. Ungur
    - P. Cheng
    - W. Shi
  group_members:
    - H. Wen
    - L. Ungur
  year: "2025"
  journal: CCS Chemistry
  links:
    doi: 10.31635/ccschem.024.202404999
    pdf: "assets/publications/2025/Gou_CCS_Chem_2025.pdf"
    si: "assets/publications/2025/Gou_CCS_Chem_2025_SI.docx"
  abstract: "Light-induced transformation from diamagnetic ligand to paramagnetic radical offers a unique approach to modulating the magnetization dynamics of magnetic compounds. In this study, we present a two-dimensional Yb(III) coordination polymer <b>1</b> and its Y(III)-diluted analog <b>1@Y</b>, along with their light-induced radical forms, <b>1a</b> and <b>1a@Y</b>. Due to the presence of light-induced radicals, the magnetic susceptibility properties (<i>χ</i><sub>M</sub><i>T</i> values) of <b>1a</b> and <b>1a@Y</b> featured remarkable 82.3% and 88.9% enhancements, respectively, at room temperature, compared with those of <b>1</b> and <b>1@Y</b>, and were accompanied by an unexpected increase in the effective energy barrier for magnetization dynamics. The magnetization dynamics of <b>1</b> and <b>1a</b> involved both Orbach and Raman processes, while <b>1@Y</b> and <b>1a@Y</b> exhibited two Raman processes, indicating that the Orbach process that occurred in <b>1</b> and <b>1a</b> was mainly attributed to the magnetic coupling between Yb(III) ions. This work showcases the potential of light-induced radical transformation for tuning both the static and dynamic magnetic properties of lanthanide coordination polymers."
  image: "assets/publications/2025/Gou_CCS_Chem_2025.png"

- title: <sup>187</sup> Os nuclear resonance scattering to explore hyperfine interactions and lattice dynamics for biological applications
  authors:
    - I. Stepanenko
    - Z. Huang
    - L. Ungur
    - D. Bessas
    - A. Chumakov
    - I. Sergueev
    - G. E. Büchel
    - A. A. Al-Kahtani
    - L. F. Chibotaru
    - J. Telser
    - V. B. Arion
  group_members:
    - Z. Huang
    - L. Ungur
  year: "2025"
  journal: Science Advances
  links:
    doi: 10.1126/sciadv.ads3406
    pdf: "assets/publications/2025/Stepanenko_SciAdv_2025.pdf"
    si: "assets/publications/2025/Stepanenko_SciAdv_2025_SI.pdf"
  abstract: "Osmium complexes with osmium in different oxidation states (II, III, IV, and VI) have been reported to exhibit antiproliferative activity in cancer cell lines. Herein, we demonstrate unexplored opportunities offered by <sup>187</sup>Os nuclear forward scattering (NFS) and nuclear inelastic scattering (NIS) of synchrotron radiation for characterization of hyperfine interactions and lattice dynamics in a benchmark Os(VI) complex, K<sub>2</sub>[OsO<sub>2</sub>(OH)<sub>4</sub>]. We determined the isomer shift [<i>δ</i> = 3.3(1) millimeters per second] relative to [Os<sup>IV</sup>Cl<sub>6</sub>]<sup>2−</sup> and quadrupole splitting [<i>Δ</i><i>E</i><sub>Q</sub> = 12.0(2) millimeters per second] with NFS. We estimated the Lamb–Mössbauer factor [0.80(4)], extracted the density of phonon states, and carried out a thermodynamics characterization using the NIS data combined with first-principles calculations. Overall, we provide evidence that <sup>187</sup>Os nuclear resonance scattering is a reliable technique for the investigation of hyperfine interactions and Os-specific vibrations in osmium(VI) species and is thus applicable for such measurements in osmium complexes of other oxidation states, including those with anticancer activity such as Os(III) and Os(IV)."
  image: "assets/publications/2025/Stepanenko_SciAdv_2025.png"

- title: "Expanding the Molecular Switches Toolbox: Photoreloadable Dithienylethene Mechanophores"
  authors:
    - M. Steponavičiūtė
    - D. Majee
    - B. Zhao
    - L. Ungur
    - S. Presolski
  group_members:
    - B. Zhao
    - L. Ungur
  year: "2025"
  journal: Angewandte Chemie International Edition
  links:
    doi: 10.1002/anie.202422549
    pdf: "assets/publications/2025/Stepanovic_Angew_2025.pdf"
    si: "assets/publications/2025/Stepanovic_Angew_2025_SI.pdf"
    vid 1: "assets/publications/2025/Stepanovic_Angew_2025_2_2_dte_opening.mp4"
    vid 2: "assets/publications/2025/Stepanovic_Angew_2025_5_5_dte_opening.mp4"
  abstract: "Molecular switches are often thought of as nanoscopic equivalents to the electrical buttons and knobs ubiquitous in everyday life. However, mechanical force is rarely used to reversibly trigger rearrangements at the atomic scale, due to the difficulty in selectively breaking certain bonds, while keeping others intact. Here, we introduce two new mechanophores based on dithienylethene (DTE), which can be toggled between two states by ultraviolet light and sonication. Attaching various lengths of poly(ɛ-caprolactone) either to the 2,2' or the 5,5' positions of the DTE core allowed us to study the kinetics of its mechanochemical cycloreversion. We employed computational methods to understand the root causes of the observed mechano-regiochemical differences. Lastly, we show that our best performing DTE-polymer conjugate can undergo numerous switching cycles by the alternating action of electromagnetic radiation and mechanical force."
  image: "assets/publications/2025/Stepanovic_Angew_2025.png"

