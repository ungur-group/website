- title: Enhanced Easy Axis Magnetic Anisotropy in a Siloxane-Bridged Linear Co<sup>II</sup><sub>3</sub> Single-Molecule Magnet
  authors:
    - M. Bhattacharya
    - S. Kumar
    - B. Schwarz
    - L. Ungur
    - K. C. Mondal
  group_members:
    - L. Ungur
  year: "2025"
  journal: Crystal Growth & Design
  links:
    doi: 10.1021/acs.cgd.5c00037
    pdf: "assets/publications/2025/Madhuri_CGD_2025.pdf"
    si: "assets/publications/2025/Madhuri_CGD_2025_SI.pdf"
  abstract: "A novel ferromagnetically coupled dianionic linear Co<sup>II</sup><sub>3</sub> complex has been synthesized and characterized as a potential single-molecule magnet (SMM) with enhanced axial magnetic anisotropy. This complex features three Co<sup>II</sup> ions out of which one Co<sup>II</sup> ion adopts an octahedral geometry and two other Co<sup>II</sup> ions adopt tetrahedral coordination geometries. The Co<sup>II</sup> ions are bridged by two siloxane dianions in a η<sup>2</sup>:η<sup>2</sup>:μ<sub>3</sub> fashion leading to a butterfly-like molecular structure, which has been studied by magnetic susceptibility measurements. Computational analysis using OpenMOLCAS, CASSCF, and CASPT2 methods revealed ferromagnetic (FM) exchange coupling between the neighboring Co<sup>II</sup> ions of about +10.2 cm<sup>–1</sup> and strong axial anisotropy parallel to the Co–Co axis for the ground exchange states. From ab initio POLY-ANISO analysis, a total magnetization blocking barrier of about 70 cm<sup>–1</sup> (101 K) and strongly reduced probabilities for quantum tunneling due to FM coupling were predicted. Magnetic ac susceptibility measurements revealed slow magnetic relaxation via an Orbach relaxation process with <i>U</i><sub>eff</sub> = 94(4) K and <i>τ</i><sub>0</sub> = 4(2)×10<sup>–10</sup> s (fitted from 8.5 to 6.25 K). Below 5 K, a pinched open hysteresis can be observed that opens more when approaching 2 K, indicating very slow magnetic relaxation in this temperature range in agreement with the predicted small quantum tunneling probabilities. These very slow magnetic relaxation times were further investigated by time-dependent dc magnetometry. Our study presents the first report on the influence of siloxane bridge binding on the SMM property of Co<sup>II</sup> nuclei by in-depth theoretical analysis and experimental susceptibility measurements, indicating the design of improved materials."
  image: "assets/publications/2025/Madhuri_CGD_2025.png"

- title: "Isolation and characterization of carbene-supported air stable Co(II)-radical complexes with bileptic redox non-innocent ligands: stability, bonding, ring-opening copolymerization studies and photo-catalytic ring cyclization activity"
  authors:
    - S. Das
    - S. Mondal
    - S. Suthar
    - R. K. Ray
    - K. Mondal
    - A. A. Raveendran
    - S. Ahamed
    - C. Maji
    - M. Baidya
    - B. Schwarz
    - D. Chakraborty
    - L. Ungur
    - K. C. Mondal
  group_members:
    - L. Ungur
  year: "2025"
  journal: Dalton Transactions
  links:
    doi: 10.1039/D5DT00727E
    pdf: "assets/publications/2025/Das_DT_2025.pdf"
    si: "assets/publications/2025/Das_DT_2025_SI.pdf"
    cif: "assets/publications/2025/Das_DT_2025.cif"
  abstract: "Two redox-active Co(II)-radical complexes (<b>3a</b> and <b>3b</b>), featuring a high-spin tetrahedral Co(II) ion, have been isolated as dark blue needles and remain stable in air for over a week. These complexes contain two redox non-innocent ligands (a carbene and a dithiolene), each with different coordinating atoms (two sulfur atoms and one carbon atom). Cyclic voltammetry (CV) reveals that complex <b>3a</b> and <b>3b</b> can form their corresponding mono-cation at potentials above −0.61 V. The structure of the complexes has been determined by single-crystal X-ray diffraction, and it has been further characterized by UV-vis, IR, Raman, EPR, and spectroscopy. DC/AC magnetometry measurements of complex <b>3a</b> show antiferromagnetic coupling between the high-spin tetrahedral Co(II) ion and the dithiolene-centered radical electron, as concluded from DFT calculations, with support from EPR measurements. Quantum mechanical magnetic model fitting to the experimental data sets suggested that complex <b>3a</b> exists in equilibrium between <i>S</i> = 1 and <i>S</i> = 2 states, depending on temperature, as reflected in the <i>M</i> vs. <i>H</i> plots. The stability, bonding, and electron density distribution of this air-stable complex <b>3a</b> have also been studied using various quantum chemical calculations. This dark-colored, photo-redox active complex (<b>3a</b>) was found to catalyse the synthesis of the well-known alkaloid natural product, N-isopentylcrinasiadine (<b>5b</b>), under photocatalytic conditions using a 427 nm Kessil light source. Additionally, complex <b>3a</b> also catalyses a copolymerization reaction in the presence of a chloride ion."
  image: "assets/publications/2025/Das_DT_2025.png"

- title: Efficient modeling of dynamic properties in K<sub>3</sub>C<sub>60</sub> using machine learning force fields
  authors:
    - R. Mo
    - Z. Huang
    - L. Ungur
  group_members:
    - R. Mo
    - L. Ungur
  year: "2025"
  journal: Chemical Physics Impact
  links:
    doi: 10.1016/j.chphi.2025.100931
    pdf: "assets/publications/2025/Mo_CPI_2025.pdf"
    si: "assets/publications/2025/Mo_CPI_2025_SI.pdf"
  abstract: "Dynamic properties of the alkali-doped molecular crystal K<sub>3</sub>C<sub>60</sub> are investigated using machine learning force field (MLFF). Our trained force fields successfully reproduce phonons comparable to those from density functional theory 10-times faster in computational efficiency. Specific heat with MLFF also show good agreement with experimental data, demonstrating its reliability for thermodynamic analysis. Two descriptor schemes, Smooth Overlap of Atomic Positions and Atomic Cluster Expansion, are employed and systematically compared. This study represents the first detailed exploration of dynamic properties in molecular crystals using MLFF, highlighting MLFF's potential in more complex molecular crystals, such as C<sub>60</sub> disorder in fullerides, molecular melting."
  image: "assets/publications/2025/Mo_CPI_2025.png"

- title: Silaiminyl-Silylene-Derived Unsymmetrical Diradicaloid Silacycles Isolated in Three Different Charge and Spin States
  authors:
    - C. Wang
    - Y. Li
    - S. M. N. V. T. Gorantla
    - M. D. Su
    - S. Ahamed
    - Z. Li
    - L. Ungur
    - K. C. Mondal
  group_members:
    - L. Ungur
  year: "2025"
  journal: Inorganic Chemistry
  links:
    doi: 10.1021/acs.inorgchem.5c01839
    pdf: "assets/publications/2025/Wang_IC_2025.pdf"
    si: "assets/publications/2025/Wang_IC_2025_SI.pdf"
  abstract: "Organosilicon diradicals with singlet or triplet spin states of the two unpaired electrons are one of the foci in main group chemistry. However, to date, the reported isolable ones are still scarce owing to their high reactivity and lack of suitable synthetic methods. In this article, a series of diradical silacycles and their corresponding isomers 1,3-disila-pyrroles were facilely obtained via the reactions of a silaiminyl-silylene (<b>1</b>) serving as a precursor of “masked” bis-silylene, with various diarylacetylenes. The computed reaction mechanisms indicated a concomitant and energetically favored formation of both isomers through distinct paths. Theoretical studies demonstrated that the singlet diradicaloid silacycles (<b>2</b>) bear two unpaired electrons asymmetrically distributed in the molecular backbone and have a remarkably small singlet-triplet energy gap that results in the observable NMR and electron paramagnetic resonance signals. Moreover, the reactivity studies of the diradical silacycle were also conducted, giving rise to multiple hydrochlorinated products under the treatment of HCl and a monoradical cation (<b>6</b>) and a dication (<b>7</b>) via stepwise oxidation of AgOTf. Compounds <b>6</b> and <b>7</b> were isolated, characterized, and studied by density functional theory calculations. Interestingly, the heterocyclic compound <b>4</b> containing a CNPSi<sub>2</sub> ring isolated from the reaction of <b>1</b> and Ad-C≡P showed Möbius-type aromaticity with the <i>NICS</i>(0) value of -6.8."
  image: "assets/publications/2025/Wang_IC_2025.png"

- title: "Air stable photo-redox active elusive Cr(iii)-tri-dithiolene-radical complexes as a new class of pseudo-supercapacitors with high capacitance: enhancement of energy storage with heavier chalcogenide"
  authors:
    - S. Das
    - M. Thosare
    - S. Ghosh
    - T. K. Shivasharma
    - S. Ahamed
    - H. S. Karnamkkott
    - B. Schwarz
    - B. R. Sankapal
    - L. Ungur
    - K. Chandra Mondal
  group_members:
    - L. Ungur
  year: "2026"
  journal: Journal of Materials Chemistry A
  links:
    doi: 10.1039/D5TA08423G
    pdf: "assets/publications/2026/Das_JMCA_2026.pdf"
    si: "assets/publications/2026/Das_JMCA_2026_SI.pdf"
    cif: "assets/publications/2026/Das_JMCA_2026.cif"
  abstract: "Chromium, an earth-abundant metal with an accessible redox potential of −0.74 V vs. RHE, emerges as a promising element for the design of high-energy-density supercapacitors. Beyond their intriguing chemistry, energy storage devices employing stable redox-active radicals of main-group elements gain increasing attention for sustainable applications. Herein, the pseudo-supercapacitive properties of two unprecedented, photo-redox active, air-stable Cr(III)-triradical complexes with the general formula [Cr(III)(SS-NHC = E<sup>•−</sup>)<sub>3</sub>] (<b>1</b>, E = S; <b>2</b>, E = Se; (SS-NHC = E) : S<sub>2</sub>-donor dithiolene ligand) are reported. Electrochemical anodes fabricated by coating these complexes onto stainless-steel substrates exhibited excellent supercapacitance performance. Complex <b>1</b> delivered a specific capacitance of 145.2 F g<sup>−1</sup>, while complex <b>2</b> showed a markedly higher value of 340.9 F g<sup>−1</sup> at 5 mV s<sup>−1</sup>, centred at <i>E</i><sub>1/2</sub> = −0.72 V. Cycling stability reached 81.2% for complex <b>1</b> and 87.3% for complex <b>2</b> after 3000 cycles. The superior activity of complex <b>2</b> arises from the substitution of sulfur with selenium in the SS-NHC = E<sup>•−</sup> ligand, which enhances redox activity, conductivity, and ion transport. Ragone plot analysis confirmed a higher energy density (14.63 Wh kg<sup>−1</sup> at 252 W kg<sup>−1</sup>) for complex <b>2</b> compared to complex <b>1</b> (8.76 Wh kg<sup>−1</sup> at 211 W kg<sup>−1</sup>). Mechanistic studies revealed that complex <b>1</b> operated via mixed surface- and diffusion-controlled processes, whereas complex <b>2</b> predominantly followed diffusion control, enabling efficient charge transport and improved pseudocapacitive behaviour."
  image: "assets/publications/2026/Das_JMCA_2026.png"

- title: Homochiral toroidal spin state in Dy(III)-based single-molecule toroics
  authors:
    - Z. Zhu
    - X. Ying
    - L. C. Adi
    - C. Zhao
    - E. J. M. Chew
    - L. Ungur
    - S. Paul
    - W. Wernsdorfer
    - C. Train
    - G. L. J. A. Rikken
    - M. Atzori
    - J. Tang
  group_members:
    - E. J. M. Chew
    - L. Ungur
  year: "2026"
  journal: Nature Chemistry
  links:
    doi: 10.1038/s41557-026-02070-4
    pdf: "assets/publications/2026/Zhu_NatChem_2026.pdf"
    si: "assets/publications/2026/Zhu_NatChem_2026_SI.pdf"
  abstract: "Single-molecule toroics, materials that combine spin and chirality at the molecular level, are promising candidates for applications in data storage, chiral spintronics and magnetoelectric devices. Over the past two decades, substantial progress has been made in the design of toroidal spin states via ligand design and coordination chemistry strategies. However, achieving homochiral magnetic vortex configurations across both molecular and unit-cell scales—a key prerequisite to induce the toroidal polarization using a homogeneous magnetic field—remains challenging. Here we report enantiopure chiral dysprosium triangles in which introduction of structural chirality induces spin homochirality. μ-SQUID magnetometry and <i>ab initio</i> calculations evidence a non-coplanar spin texture that exhibits a toroidal ground state at low temperature. Furthermore, magneto-chiral dichroism spectroscopy, a technique sensitive to both chirality and magnetization, reveals unusual behaviours below 4.5 K, the temperature at which the coupling between Dy(III) ions favours the generation of a toroidal spin state."
  image: "assets/publications/2026/Zhu_NatChem_2026.png"
