  abstract: "Cyclic alkyl(amino) carbene stabilized two- and three-coordinate Fe(I) complexes, (cAAC)<sub>2</sub>FeCl (<b>2</b>) and [(cAAC)<sub>2</sub>Fe][B(C<sub>6</sub>F<sub>5</sub>)<sub>4</sub>] (<b>3</b>), respectively, were prepared and thoroughly studied by a bouquet of analytical techniques as well as theoretical calculations. Magnetic susceptibility and Mössbauer spectroscopy reveal the +1 oxidation state and <i>S</i> = 3/2 spin ground state of iron in both compounds. <b>2</b> and <b>3</b> show slow magnetic relaxation typical for single molecule magnets under an applied direct current magnetic field. The high-frequency EPR measurements confirm the <i>S</i> = 3/2 ground state with a large, positive zero-field splitting (∼ 20.4 cm<sup>-1</sup>) and reveal easy plane anisotropy for compound <b>2</b>. CASSCF/CASPT2/RASSI-SO ab initio calculations using the MOLCAS program package support the experimental results."
