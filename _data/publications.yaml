    pdf: "assets/publications/2021/Nguyen_PCCP_2021.pdf"
    si: "assets/publications/2021/Nguyen_PCCP_2021_SI.pdf"
  abstract: "Herein, we report a theoretical investigation of the electronic structure and magnetic properties in [(Cp<sup>Me4H</sup><sub>2</sub>Ln(THF))<sub>2</sub>(μ-N<sub>2</sub><sup>•</sup>)]<sup>−</sup> and [(Cp<sup>Me4H</sup><sub>2</sub>Ln)<sub>2</sub>(μ-N<sub>2</sub><sup>•</sup>)]<sup>−</sup> (THF = tetrahydrofuran, Cp<sup>Me4H</sup> = tetramethylcyclopentadienyl, Ln = Tb, Dy) complexes [as reported in Demir et al., Nat. Commun., 8, 1–9, 2144 (2017)]. By ab initio methods, their magnetic blocking behaviors are successfully characterized allowing elucidation of the origin of the two blocking barriers observed experimentally. In addition, a detailed analysis of exchange wave functions explains why the blocking barrier of the Tb complexes is roughly twice as large as that of the Dy analogues, a fact which appears to be a general trend exhibited in this family of compounds."
