  abstract: "The (cAAC)<sub>2</sub>Mn complex (cAAC=cyclic alkyl(amino)carbene) features a linear two-coordinate Mn center. The antiferromagnetic coupling of a radical electron, delocalized on two carbene C atoms, with the central Mn<sup>I</sup> having d<sup>6</sup> electronic configuration, mainly contributes to the <i>S</i><sub>T</sub>=3/2 ground state. Treatment of (cAAC)<sub>2</sub>Mn with H<sub>2</sub> at RT resulted in the addition of H atoms at both “carbene” C atoms, leaving the central Mn atom in the <i>S</i><sub>T</sub>=5/2 spin ground state."
