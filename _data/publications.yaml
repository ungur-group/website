    si: "assets/publications/2019/Kuhne_DT_2019_SI.pdf"
    cif: "assets/publications/2019/Kuhne_DT_2019.cif"
  abstract: "We present the synthesis, magnetic and photophysical properties of four mononuclear Ln<sup>III</sup> complexes in two isostructural lattices containing Gd<sup>III</sup> and Er<sup>III</sup>. A heptadentate Schiff base ligand and acetate versus trifluoroacetate were used to synthesise complexes <b>1</b>–<b>4</b>, among which the two Er<sup>III</sup> complexes <b>2</b> and <b>4</b> exhibit field-induced SIM behaviour with almost similar <i>U</i><sub>eff</sub> values (31.6 K for <b>2</b> and 32.7 K for <b>4</b>). Ab initio calculations show the structure of the low-lying energy states and highlight that there is already significant tunnelling in the ground doublet state, but the application of a weak magnetic field of 0.05 T is sufficient for ac magnetic measurements to suppress tunnelling in the ground state. The calculated main magnetic axes (<i>g</i><sub>Z</sub>) of the ground Kramers doublets show small differences between the two Er<sup>III</sup> compounds <b>2</b> and <b>4</b> due to their different ligand fields."
  image: "assets/publications/2019/Kuhne_DT_2019.png"

- title: An Inconspicuous Six-Coordinate Neutral Dy<sup>III</sup> Single-Ion Magnet with Remarkable Magnetic Anisotropy and Stability
  authors:
    - M. Li
    - H. Wu
    - Z. Xia
    - L. Ungur
    - D. Liu
    - L. F. Chibotaru
    - H. Ke
    - S. Chen
