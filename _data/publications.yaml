  abstract: "A toroidal magnetic moment in the absence of conventional total magnetic moment is observed in a {Dy<sub>6</sub>} ring. The reason for the net toroidal arrangement of the local magnetic moments is the high symmetry of the complex in combination with strong intra-molecular dipolar interactions between Dy ions. The description of single-ion and inter-ion anisotropic magnetic interactions is achieved here for the first time fully <i>ab initio</i>, i.e., without use of phenomenological parameters."
