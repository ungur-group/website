- title: Interplay of Strongly Anisotropic Metal Ions in Magnetic Blocking of Complexes
  authors:
    - L. Ungur
    - M. Thewissen
    - J. P. Costes
    - W. Wernsdorfer
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2013"
  journal: Inorganic Chemistry
  links:
    doi: 10.1021/ic302568x
    pdf: "assets/publications/2013/Ungur_IC_2013.pdf"
    si: "assets/publications/2013/Ungur_IC_2013_SI.pdf"
  abstract: "The key characteristic of single-molecule magnets (SMMs) is the anisotropy-induced blocking barrier, which should be as efficient as possible, i.e., to be able to provide long magnetic relaxation times at elevated temperatures. The strategy for the design of efficient SMMs on the basis of transition-metal complexes such as Mn<sub>12</sub>Ac is well established, which is not the case of complexes involving strongly anisotropic metal ions such as cobalt(II) and lanthanides (Ln). While strong intraionic anisotropy in the latter allows them to block the magnetization already in mononuclear complexes, the presence of several such ions in a complex does not result automatically in more efficient SMMs. Here, the magnetic blocking in the series of isostructural 3d–4f complexes Co<sup>II</sup>–Ln<sup>III</sup>–Co<sup>II</sup>, Ln = Gd, Tb, and Dy, is analyzed using an originally developed <i>ab initio</i> based approach for the investigation of blocking barriers. The theoretical analysis allows one to explain the counterintuitive result that the Co–Gd–Co complex is a better SMM than terbium and dysprosium analogues. It turns out that the highly efficient magnetic blockage in the Co–Gd–Co complex results from a concomitant effect of unexpectedly large unquenched orbital momentum on Co<sup>II</sup> ions (ca. 1.7 <i>μ</i><sub>B</sub>) and the large spin on the gadolinium (<i>S</i> = 7/2), which provides a multilevel blocking barrier, similar to the one of the classical Mn<sub>12</sub>Ac. We conclude that efficient SMMs could be obtained in complexes combining strongly anisotropic and isotropic metal ions with large angular momentum rather than in polynuclear compounds involving strongly anisotropic ions only."
  image: "assets/publications/2013/Ungur_IC_2013.png"

- title: Magnetic relaxation pathways in lanthanide single-molecule magnets
  authors:
    - R. J. Blagg
    - L. Ungur
    - F. Tuna
    - J. Speak
    - P. Comar
    - D. Collison
    - W. Wernsdorfer
    - E. J. L. McInnes
    - L. F. Chibotaru
    - R. E. P. Winpenny
  group_members:
    - L. Ungur
  year: "2013"
  journal: Nature Chemistry
  links:
    doi: 10.1038/nchem.1707
    pdf: "assets/publications/2013/Blagg_NatChem_2013.pdf"
    si: "assets/publications/2013/Blagg_NatChem_2013_SI.pdf"
    cif: "assets/publications/2013/Blagg_NatChem_2013.cif"
  abstract: "Single-molecule magnets are compounds that exhibit magnetic bistability caused by an energy barrier for the reversal of magnetization (relaxation). Lanthanide compounds are proving promising as single-molecule magnets: recent studies show that terbium phthalocyanine complexes possess large energy barriers, and dysprosium and terbium complexes bridged by an N<sub>2</sub><sup>3-</sup> radical ligand exhibit magnetic hysteresis up to 13 K. Magnetic relaxation is typically controlled by single-ion factors rather than magnetic exchange (whether one or more 4f ions are present) and proceeds through thermal relaxation of the lowest excited states. Here we report polylanthanide alkoxide cage complexes, and their doped diamagnetic yttrium analogues, in which competing relaxation pathways are observed and relaxation through the first excited state can be quenched. This leads to energy barriers for relaxation of magnetization that exceed 800 K. We investigated the factors at the lanthanide sites that govern this behaviour."
  image: "assets/publications/2013/Blagg_NatChem_2013.png"

- title: "Angular-Resolved Magnetometry Beyond Triclinic Crystals: Out-of-Equilibrium Studies of Cp*ErCOT Single-Molecule Magnet"
  authors:
    - M. Boulon
    - G. Cucinotta
    - S. Liu
    - S. Jiang
    - L. Ungur
    - L. F. Chibotaru
    - S. Gao
    - R. Sessoli
  group_members:
    - L. Ungur
  year: "2013"
  journal: Chemistry – A European Journal
  links:
    doi: 10.1002/chem.201302600
    pdf: "assets/publications/2013/Boulon_CEJ_2013.pdf"
    si: "assets/publications/2013/Boulon_CEJ_2013_SI.pdf"
  abstract: "Angular-resolved single-crystal magnetometry is a key tool to characterise lanthanide-based materials with low symmetry, for which conjectures based on idealised geometries can be totally misleading. Unfortunately the technique is strictly successful only for triclinic structures, thus reducing significantly its application. By collecting out-of-equilibrium magnetisation data the technique was extended to the orthorhombic organometallic Cp*ErCOT single-molecule magnet (SMM), thus allowing for the first time the reconstruction of the molecular anisotropy tensor notwithstanding the two molecular orientations in the crystal lattice. The results, flanked by state-of-the-art ab initio calculations, confirmed the expected orientation of the molecular easy axis of magnetisation and thus validated the synthetic strategy based on organometallic complexes of a single lanthanide ion."
  image: "assets/publications/2013/Boulon_CEJ_2013.png"

