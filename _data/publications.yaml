    si: "assets/publications/2012/Bhunia_IC_2012_SI.pdf"
    cif: "assets/publications/2012/Bhunia_IC_2012.cif"
  abstract: "The Schiff base compound 2,2'-{[(2-aminoethyl)imino]bis[2,1-ethanediyl-nitriloethylidyne]}bis-2-hydroxy-benzoic acid (H<sub>4</sub>L) as a proligand was prepared in situ. This proligand has three potential coordination pockets which make it possible to accommodate from one to three metal ions allowing for the possible formation of mono-, di-, and trinuclear complexes. Reaction of in situ prepared H<sub>4</sub>L with Dy(NO<sub>3</sub>)<sub>3</sub>·5H<sub>2</sub>O resulted in the formation of a mononuclear complex [Dy(H<sub>3</sub>L)<sub>2</sub>](NO<sub>3</sub>)·(EtOH)·8(H<sub>2</sub>O) (<b>1</b>), which shows SMM behavior. In contrast, reaction of in situ prepared H<sub>4</sub>L with Mn(ClO<sub>4</sub>)<sub>2</sub>·6H<sub>2</sub>O and Dy(NO<sub>3</sub>)<sub>3</sub>·5H<sub>2</sub>O in the presence of a base resulted in a trinuclear mixed 3d-4f complex (NHEt<sub>3</sub>)<sub>2</sub>[Dy{Mn(L)}<sub>2</sub>](ClO<sub>4</sub>)·2(H<sub>2</sub>O) (<b>2</b>). At low temperatures, compound <b>2</b> is a weak ferromagnet. Thus, the SMM behavior of compound <b>1</b> can be switched off by incorporating two Mn(II) ions in close proximity either side of the Dy(III). This quenching behavior is ascribed to the presence of the weak ferromagnetic interactions between the Mn(II) and Dy(III) ions, which at <i>T</i> > 2 K act as a fluctuating field causing the reversal of magnetization on the dysprosium ion. Mass spectrometric ion signals related to compounds <b>1</b> and <b>2</b> were both detected in positive and negative ion modes via electrospray ionization mass spectrometry. Hydrogen/deuterium exchange (HDX) reactions with ND<sub>3</sub> were performed in a FT-ICR Penning-trap mass spectrometer."
  image: "assets/publications/2012/Bhunia_IC_2012.png"

