- title: <i>Ab initio</i> calculation of anisotropic magnetic properties of complexes. I. Unique definition of pseudospin Hamiltonians and their derivation
  authors:
    - L. F. Chibotaru
    - L. Ungur
  group_members:
    - L. Ungur
  year: "2012"
  journal: The Journal of Chemical Physics
  links:
    doi: 10.1063/1.4739763
    pdf: "assets/publications/2012/Chibotaru_JCP_2012.pdf"
  abstract: "A methodology for the rigorous nonperturbative derivation of magnetic pseudospin Hamiltonians of mononuclear complexes and fragments based on <i>ab initio</i> calculations of their electronic structure is described. It is supposed that the spin-orbit coupling and other relativistic effects are already taken fully into account at the stage of quantum chemistry calculations of complexes. The methodology is based on the establishment of the correspondence between the <i>ab initio</i> wave functions of the chosen manifold of multielectronic states and the pseudospin eigenfunctions, which allows to define the pseudospin Hamiltonians in the unique way. Working expressions are derived for the pseudospin Zeeman and zero-field splitting Hamiltonian corresponding to arbitrary pseudospins. The proposed calculation methodology, already implemented in the SINGLE_ANISO module of the MOLCAS-7.6 quantum chemistry package, is applied for a first-principles evaluation of pseudospin Hamiltonians of several complexes exhibiting weak, moderate, and very strong spin-orbit coupling effects."
  image: "assets/publications/2012/Chibotaru_JCP_2012.png"

