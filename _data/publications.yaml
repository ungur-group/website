    pdf: "assets/publications/2024/Kushvaha_EJIC_2024.pdf"
    si: "assets/publications/2024/Kushvaha_EJIC_2024_SI.pdf"
  abstract: "Single–ion magnets (SIMs) possessing a Dy<sup>III</sup> ion have recently attracted huge scientific attention. Herein, we report on a Dy<sup>III</sup>-radical single–molecule magnet containing a seven-coordinate Dy<sup>III</sup> ion with an O<sub>3</sub>N<sub>3</sub>Cl donor set. The frequency–dependent slow relaxation of magnetization has been observed below 8 K. DC magnetic studies have shown the presence of weak antiferromagnetic coupling between the Kramers ion (Dy<sup>III</sup>, <i>J</i> = 15/2) and the ligand-centered radical electron (<i>S</i> = 1/2) which was confirmed by multifunctional CASSCF calculations."
