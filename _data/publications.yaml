- title: Highly Oxidized States of Phthalocyaninato Terbium(III) Multiple-Decker Complexes Showing Structural Deformations, Biradical Properties and Decreases in Magnetic Anisotropy
  authors:
    - Y. Horii
    - M. Damjanović
