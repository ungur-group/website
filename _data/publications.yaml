# Conventions to follow

# Title and abstract in a single line.
# Author names are abbreviated as "A. B. C. Lastname"
# -, –, and — for respectively hyphen, en-dash, and em-dash
# Prefer literal symbols over unicode
# <sub>i</sub> for subscript and <sup>i</sup> for superscript
# <b>i</b> for bold and <i>i</i> for italic

# Book Chapters

- title: Computational Modelling of the Magnetic Properties of Lanthanide Compounds
  authors:
    - L. Ungur
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2015"
  journal: Lanthanides and Actinides in Molecular Magnetism
  links:
    doi: 10.1002/9783527673476.ch6
    pdf: "assets/publications/book/ungur2015_BC.pdf"
  abstract: "This chapter revises several findings and insights in the field of lanthanide molecular magnetism obtained with the <i>ab initio</i> approach. It gives a short review of the key points of the computational scheme suitable for the description of electronic structure in lanthanides. Currently there are two approaches for (partial) account of dynamical correlation to a multiconfigurational complete active space self-consistent field (CASSCF) wave function: (i) perturbative and (ii) configuration interaction (CI) methods. Two-component DFT methods aim at solving the reduced form of the four component Dirac equation using DFT formalism. A prominent feature of polynuclear lanthanide complexes, which distinguishes them from transition metal (TM) complexes, is their noncollinear magnetic structure. The magnetic structure in the ground exchange multiplets of mixed compounds is richer than in pure lanthanide complexes and depends on the nature of TM ions and on the relative orientations of the main magnetic axes on Ln ions."

- title: Introduction to the electronic structure, luminescence, and magnetism of lanthanides
  authors:
    - L. Ungur
  group_members:
    - L. Ungur
  year: "2018"
  journal: Lanthanide-Based Multifunctional Materials
  links:
    doi: 10.1016/B978-0-12-813840-3.00001-6
    pdf: "assets/publications/book/ungur2018_BC.pdf"
  abstract: "This introductory chapter describes theoretical tools and methods employed for the description of the optical and magnetic properties of lanthanide compounds. First, we introduce the electronic structure of the free lanthanide ions in gas phase, a multiplet structure with an overview of the effect of the ligand (crystal) environment on the low-lying multiplets. Second, crystal and ligand field theories applied in this field are briefly introduced together with their grounds and drawbacks. The foundations of the Judd–Ofelt theory describing the intensities of the optical transitions in lanthanide compounds are discussed. Recent advances in the <i>ab initio</i> theoretical methods used for the description of lanthanide complexes are introduced. Further, theoretical requirements for top-performant molecular magnets are reviewed alongside a brief review of the recent top-performant molecular magnets obtained experimentally. Finally, a personal opinion regarding the future (theoretical) work that needs to be done in this area is given."

- title: Calculations of Magnetic Exchange in Multinuclear Compounds
  authors:
    - G. T. Nguyen
    - L. Ungur
  group_members:
    - G. T. Nguyen
    - L. Ungur
  year: "2023"
  journal: Computational Modelling of Molecular Nanomagnets
  links:
    doi: 10.1007/978-3-031-31038-6_3
    pdf: "assets/publications/book/giang2023_BC.pdf"
  abstract: "The magnetic exchange interaction between metal centers in multinuclear compounds plays a defining role in their low-temperature magnetic behavior. Predicting magnetic exchange by computational methods is of high importance for the development of novel magnetic, spintronic materials, and devices that drives further the development of advanced computational methods. In this chapter, we give a brief overview of the origin of magnetic exchange and describe various microscopic theories accounting for it. Several computational approaches which allow the estimation of magnetic exchange in multinuclear compounds are reviewed. Computational challenges of the existing methods for accounting for the magnetic exchange will be discussed in detail in subsequent sections. The combination between accurate on-site eigenstates obtained in <i>ab initio</i> calculations (CASSCF + SOC + ANISO) and theoretical modeling of the magnetic dipole–dipole and exchange interactions within the Lines model, and the recently developed kinetic exchange model is described alongside several recent examples. The last section offers a review of several results obtained recently and gives our perspective on how to achieve an efficient interplay between strong magnetic exchange and a highly axial crystal field on metal sites for designing better exchange-coupled multinuclear single-molecule magnets."

# Publications

- title: A dinuclear cobalt(II) complex of calix[8]arenes exhibiting strong magnetic anisotropy
  authors:
    - S. Petit
    - G. Pilet
    - D. Luneau
    - L. F. Chibotaru
    - L. Ungur
  group_members:
    - L. Ungur
  year: "2007"
  journal: Dalton Transactions
  links:
    doi: 10.1039/b708926k
    pdf: "assets/publications/2007/Petit_DT_2007.pdf"
    cif: "assets/publications/2007/Petit_DT_2007.cif"
  abstract: "The solvothermal reaction of cobalt(II) acetate with <i>p</i>-tert-butylcalix[8]arene (calix) and triethylamine affords the compound (Et<sub>3</sub>NH)<sub>2</sub>[Co<sup>II</sup><sub>2</sub>(calix)<sub>2</sub>] (<b>1</b>·2Et<sub>3</sub>NH) that shows a hydrogen bond bridged dinuclear complex [Co<sup>II</sup><sub>2</sub>(calix)<sub>2</sub>]<sup>2-</sup> (<b>1</b>) with cobalt(II) ions in a tetrahedral geometry. The compound crystallises in the monoclinic, space group <i>P</i>2<sub>1</sub>/<i>n</i> with cell parameters <i>a</i> = 14.89(1) Å, <i>b</i> = 20.90(2) Å, <i>c</i> = 30.87(4) Å, <i>β</i> = 102.57(7)°, <i>V</i> = 9376(16) Å<sup>3</sup>, <i>Z</i> = 2. The magnetic studies together with <i>ab initio</i> calculations are evidence of an important role of the geometry of the second coordination sphere of carbon and hydrogen atoms around the CoO<sub>4</sub> core in quantifying the zero-field splitting on cobalt sites. This results in strong magnetic anisotropies with a negative axial component on the cobalt fragments."
  image: "assets/publications/2007/Petit_DT_2007.png"

- title: "The Origin of Nonmagnetic Kramers Doublets in the Ground State of Dysprosium Triangles: Evidence for a Toroidal Magnetic Moment"
  authors:
