  abstract: "<b>Triangular donuts</b>: High-level <i>ab initio</i> calculations reveal a toroidal arrangement of local magnetizations at dysprosium sites in the ground state of triangular dysprosium complexes (see picture), an arrangement that explains their unusual magnetic properties."
