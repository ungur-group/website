  abstract: "Two heterometallic [Dy<sup>III</sup><sub>6</sub>Mn<sup>III</sup><sub>12</sub>] clusters comprising of the same [Mn<sup>III</sup><sub>8</sub>O<sub>13</sub>] fragment, four isolated Mn<sup>III</sup> ions and two linear [Dy<sup>III</sup><sub>3</sub>] units have been synthesised. Except for the same composition, the main difference of these two cores lies in the coordination environment and the orientations of the linear [Dy<sup>III</sup><sub>3</sub>] units. This difference leads to an alternation in the symmetry of the two cores that significantly modulates their magnetic properties including ground spin state and slow relaxation behavior."
