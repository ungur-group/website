- title: Ab initio investigation of the non-collinear magnetic structure and the lowest magnetic excitations in dysprosium triangles
  authors:
    - L. Ungur
    - W. Van Den Heuvel
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2009"
  journal: New Journal of Chemistry
  links:
    doi: 10.1039/b903126j
    pdf: "assets/publications/2009/Ungur_NJC_2009.pdf"
  abstract: "The unusual magnetism exhibited by dysprosium triangles [Dy<sub>3</sub>(μ<sub>3</sub>-OH)<sub>2</sub>L<sub>3</sub>Cl<sub>2</sub>(H<sub>2</sub>O)<sub>4</sub>][Dy<sub>3</sub>(μ<sub>3</sub>-OH)<sub>2</sub>L<sub>3</sub>Cl(H<sub>2</sub>O)<sub>5</sub>]Cl<sub>5</sub>·19H<sub>2</sub>O is explained using the recently developed <i>ab initio</i> methodology for the simulation of magnetic properties of complexes. The local anisotropy axes on the dysprosium sites are found to lie in the plane of the Dy<sub>3</sub> triangle and to make angles of ca. 120° with each other. The small antiferromagnetic exchange interaction between sites leads to a non-magnetic Kramers doublet in the ground state of the complex. The arrangement of the local magnetization vectors in this state is close to toroidal. By contrast, the lowest excited states are characterized by a huge magnetic moments of ca. 20 <i>μ</i><sub>B</sub> and show very different behavior of magnetization for fields applied along and perpendicular to the plane of the Dy<sub>3</sub> triangle."
  image: "assets/publications/2009/Ungur_NJC_2009.png"

