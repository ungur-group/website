  abstract: "A planar tetradentate 3,6-bis(2-pyrimidyl)-1,2,4,5-tetrazine (BpymTz) templating chelate affords the formation of an unprecedented BpymTz˙− radical anion bridged {Ni<sup>II</sup><sub>4</sub>} complex. Detailed magnetic measurements performed on the isolated air stable [Ni<sup>II</sup><sub>4</sub>(BpymTz˙−)Cl<sub>6</sub>(DMF)<sub>8</sub>]Cl·0.5(H<sub>2</sub>O) compound reveal strong ferromagnetic Ni<sup>II</sup>–BpymTz˙− interactions with a coupling constant of <i>J</i> = 98.84 cm<sup>-1</sup>."
