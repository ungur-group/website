- title: "Structure, Magnetism, and Theoretical Study of a Mixed-Valence Co<sup>II</sup><sub>3</sub>Co<sup>III</sup><sub>4</sub> Heptanuclear Wheel: Lack of SMM Behavior despite Negative Magnetic Anisotropy"
  authors:
    - L. F. Chibotaru
    - L. Ungur
    - C. Aronica
    - H. Elmoll
    - G. Pilet
    - D. Luneau
  group_members:
    - L. Ungur
  year: "2008"
  journal: Journal of the American Chemical Society
  links:
    doi: 10.1021/ja8029416
    pdf: "assets/publications/2008/Chibotaru_JACS_2008.pdf"
    si: "assets/publications/2008/Chibotaru_JACS_2008_SI.pdf"
    cif: "assets/publications/2008/Chibotaru_JACS_2008.cif"
  abstract: "A mixed-valence Co(II)/Co(III) heptanuclear wheel [Co<sup>II</sup><sub>3</sub>Co<sup>III</sup><sub>4</sub>(L)<sub>6</sub>(MeO)<sub>6</sub>] (LH<sub>2</sub> = 1,1,1-trifluoro-7-hydroxy-4-methyl-5-aza-hept-3-en-2-one) has been synthesized and its crystal structure determined using single-crystal X-ray diffraction. The valence state of each cobalt ion was established by bond valence sum calculations. Studies of the temperature dependence of the magnetic susceptibility and the field dependence of the magnetization evidence ferromagnetic interactions within the compound. In order to understand the magnetic properties of this Co<sub>7</sub> wheel, we performed <i>ab initio</i> calculations for each cobalt fragment at the CASSCF/CASPT2 level, including spin-orbit coupling effects within the SO-RASSI approach. The four Co(III) ions were found to be diamagnetic and to give a significant temperature-independent paramagnetic contribution to the susceptibility. The spin-orbit coupling on the three Co(II) sites leads to separations of ~200 cm<sup>-1</sup> between the ground and excited Kramers doublets, placing the Co<sub>7</sub> wheel into a weak-exchange limit in which the lowest electronic states are adequately described by the anisotropic exchange interaction between the lowest Kramers doublets on Co(II) sites. Simulation of the exchange interaction was done within the Lines model, keeping the fully <i>ab initio</i> treatment of magnetic anisotropy effects on individual cobalt fragments using a recently developed methodology. A good description of the susceptibility and magnetization was obtained for nearest-neighbor (J<sub>1</sub>) and next-nearest-neighbor (J<sub>2</sub>) exchange parameters (1.5 and 5.5 cm<sup>-1</sup>, respectively). The strong ferromagnetic interaction between distant cobalt ions arises as a result of low electron-promotion energies in the exchange bridges containing Co(III) ions. The calculations showed a large value of the magnetization along the main magnetic axis (10.1 µ<sub>B</sub>), which is a combined effect of the ferromagnetic exchange interaction and negative magnetic anisotropy on the two marginal Co(II) sites. The lack of single-molecule magnet behavior in [Co<sup>II</sup><sub>3</sub>Co<sup>III</sup><sub>4</sub>(L)<sub>6</sub>(MeO)<sub>6</sub>] is explained by relatively large matrix elements of transverse magnetic moments between states of maximal magnetization of the ground Kramers doublet, evidenced by <i>ab initio</i> calculations, and the associated large tunneling rates between these states in the presence of dipolar transverse magnetic fields in the crystal."
  image: "assets/publications/2008/Chibotaru_JACS_2008.png"

