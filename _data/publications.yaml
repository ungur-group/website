- title: Synthesis, structure, magnetism and theoretical study of a series of complexes with a decanuclear core [Ln<sup>III</sup><sub>2</sub>Cu<sup>II</sup><sub>8</sub>] (Ln = Y, Gd, Tb, Dy)
  authors:
    - A. Borta
    - E. Jeanneau
    - Y. Chumakov
    - D. Luneau
    - L. Ungur
    - L. F. Chibotaru
    - W. Wernsdorfer
  group_members:
    - L. Ungur
  year: "2011"
  journal: New Journal of Chemistry
  links:
    doi: 10.1039/c0nj00931h
    pdf: "assets/publications/2011/Borta_NJC_2011.pdf"
    si: "assets/publications/2011/Borta_NJC_2011_SI.pdf"
    cif: "assets/publications/2011/Borta_NJC_2011.cif"
  abstract: "A family of four isomorph complexes with a decanuclear [Cu<sub>8</sub>Ln<sub>2</sub>] core of general formula [Ln<sub>2</sub>Cu<sub>8</sub>(μ-PyO)<sub>12</sub>(μ<sub>4</sub>-O)<sub>2</sub>(μ-Cl)<sub>2</sub>Cl<sub>4</sub>(H<sub>2</sub>O)<sub>2</sub>]·<i>n</i>H<sub>2</sub>O [Ln(III) = Y(III) (<b>1</b>), Gd(III) (<b>2</b>), Tb(III) (<b>3</b>), Dy(III) (<b>4</b>); 2-PyOH = 2-hydroxypyridine] was isolated and structurally characterized. All compounds are isomorphs and may be viewed as a hexanuclear central core sandwiched in between two lateral dinuclear copper units. The temperature dependence of the magnetic susceptibility and the field dependence of the magnetization were investigated on polycrystalline samples. The yttrium compound <b>1</b> showed an overall behavior dominated by an antiferromagnetic interaction between the copper ions, while for compounds <b>2</b>–<b>4</b> the magnetic behavior indicated the addition of a ferromagnetic interaction with the lanthanide ions. The magnetic properties were computationally studied by means of fragment <i>ab initio</i> calculations. The calculation on the yttrium complex allowed determining the strength and sign of the Cu···Cu magnetic interactions considering three antiferromagnetic coupling constants: two within the central (<i>J</i><sub>3</sub> = -44 cm<sup>-1</sup>) and the lateral (<i>J</i><sub>4</sub> = -40 cm<sup>-1</sup>) copper dinuclear unit, and one (<i>J</i><sub>5</sub> = -24 cm<sup>-1</sup>) between the lateral and the central copper. Simulation of the magnetic behavior of the Dy (<b>4</b>) compound gave <i>J</i><sub>1</sub> = +0.25 cm<sup>-1</sup> for Dy–Dy and <i>J</i><sub>2</sub> = +2.0 cm<sup>-1</sup> for Dy–Cu pairs. The calculated <i>g</i> tensors of the copper(II) ions were found to be quite anisotropic and contributed via anisotropic exchange interactions, together with zero-field (crystal field) splitting on Ln, to the weak single-molecule magnet (SMM) behavior of <b>2</b>, <b>3</b> and <b>4</b>. Among them, the highest coercivity was found in the gadolinium complex (<b>2</b>), despite the fact that it is much less anisotropic than the other two. We explain this surprising result by a higher multiplicity of the ground spin term in <b>2</b> compared to the ground manifolds of states in <b>3</b> and <b>4</b>. Besides, due to relatively large Cu–Gd interaction, the ground exchange term in <b>2</b> has enough separation from excited exchange terms, which makes the barrier of reversal of magnetization efficient in this complex."
  image: "assets/publications/2011/Borta_NJC_2011.png"

