  abstract: "Macrocyclic single-molecule magnet: The dynamic behavior of the tetranuclear zinc(II)–dysprosium(III) complex of the hexaimine [3+3] macrocycle (LPr)<sup>6-</sup> under an external DC field (1500 Oe) indicates that it is a single-molecule magnet (SMM). It is the first to contain a single lanthanide ion (in orange, see graphic) coordinated inside the cavity of a single macrocyclic ligand and thus represents a new class of SMM."
  image: "assets/publications/2011/Feltham_CEJ_2011.png"

- title: Single-Molecule Magnet Behavior for an Antiferromagnetically Superexchange-Coupled Dinuclear Dysprosium(III) Complex
  authors:
    - J. Long
    - F. Habib
    - P. H. Lin
    - I. Korobkov
    - G. Enright
    - L. Ungur
    - W. Wernsdorfer
    - L. F. Chibotaru
    - M. Murugesu
  group_members:
