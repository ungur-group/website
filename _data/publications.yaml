    - L. Ungur
    - L. F. Chibotaru
    - M. Heidemeier
    - E. Krickemeyer
    - A. Stammler
    - H. Bögge
    - C. Schröder
    - J. Schnack
    - T. Glaser
  group_members:
    - L. Ungur
  year: "2012"
  journal: Chemical Science
  links:
    doi: 10.1039/c2sc20649h
    pdf: "assets/publications/2012/Hoeke_CS_2012.pdf"
    si: "assets/publications/2012/Hoeke_CS_2012_SI.pdf"
    cif: "assets/publications/2012/Hoeke_CS_2012.cif"
    movie 1: "assets/publications/2012/Hoeke_CS_2012_movie_1.avi"
    movie 2: "assets/publications/2012/Hoeke_CS_2012_movie_2.avi"
    movie 3: "assets/publications/2012/Hoeke_CS_2012_movie_3.avi"
    movie 4: "assets/publications/2012/Hoeke_CS_2012_movie_4.avi"
  abstract: "We have synthesized the triplesalen-based single-molecule magnet (SMM) [Mn<sup>III</sup><sub>6</sub>Mn<sup>III</sup>]<sup>3+</sup> as a variation of our SMM [Mn<sup>III</sup><sub>6</sub>Cr<sup>III</sup>](BPh<sub>4</sub>)<sub>3</sub>. The use of the rod-shaped anion lactate (lac) was intended to enforce a rod packing and resulted in the crystallization of [Mn<sup>III</sup><sub>6</sub>Mn<sup>III</sup>](lac)<sub>3</sub> in the highly symmetric space group R3̄. This entails a crystallographic S<sub>6</sub> symmetry of the [Mn<sup>III</sup><sub>6</sub>Mn<sup>III</sup>]<sup>3+</sup> molecules, which in addition are all aligned with the crystallographic c axis. Moreover, the molecular environment of each [Mn<sup>III</sup><sub>6</sub>Mn<sup>III</sup>]<sup>3+</sup> molecule is highly symmetric. Single-crystals of [Mn<sup>III</sup><sub>6</sub>Mn<sup>III</sup>](lac)<sub>3</sub> exhibit a double hysteresis at 0.3 K with a hysteretic opening not only for the spin ground state up to 1.8 T, but also for an excited state becoming the ground state at ≈ 3.4 T with a hysteretic opening up to 10 T. <i>Ab initio</i> calculations including spin-orbit coupling establish a non-magnetic behavior of the central Mn<sup>III</sup> low-spin (l.s.) ion at low temperatures, demonstrating that predictions from ligand-field theory are corroborated in the case of Mn<sup>III</sup> l.s. by <i>ab initio</i> calculations. Simulations of the field- and temperature-dependent magnetization data indicate that [Mn<sup>III</sup><sub>6</sub>Mn<sup>III</sup>]<sup>3+</sup> is in the limit of weak exchange (<i>J</i> ≪ <i>D</i>) with antiferromagnetic interactions in the trinuclear Mn<sup>III</sup><sub>3</sub> triplesalen subunits resulting in intermediate <i>S</i>* = 2 spins. Slight ferromagnetic interactions between the two trinuclear Mn<sup>III</sup><sub>3</sub> subunits lead to a ground state in zero-field that is approximately described by a total spin quantum number <i>S</i> = 4. This ground state exhibits only a very small anisotropy barrier due to the misalignment of the local zero-field splitting tensors. At higher magnetic fields of ≈ 3.4 T, the spin configuration changes to an all-up orientation of the local Mn<sup>III</sup> spins, with the main part of the Zeeman energy needed for the spin-flip being required to overcome the local Mn<sup>III</sup> anisotropy barriers, while only minor contributions of the Zeeman energy are needed to overcome the antiferromagnetic interactions. These combined theoretical analyses provide a clear picture of the double-hysteretic behavior of the [Mn<sup>III</sup><sub>6</sub>Mn<sup>III</sup>]<sup>3+</sup> single-molecule magnet with hysteretic openings up to 10 T."
  image: "assets/publications/2012/Hoeke_CS_2012.png"

- title: Supramolecular architectures for controlling slow magnetic relaxation in field-induced single-molecule magnets
  authors:
    - F. Habib
    - J. Long
    - P. H. Lin
    - I. Korobkov
    - L. Ungur
    - W. Wernsdorfer
    - L. F. Chibotaru
    - M. Murugesu
  group_members:
    - L. Ungur
  year: "2012"
  journal: Chemical Science
  links:
    doi: 10.1039/c2sc01029a
    pdf: "assets/publications/2012/Habib_CS_2012.pdf"
    si: "assets/publications/2012/Habib_CS_2012_SI.pdf"
    cif: "assets/publications/2012/Habib_CS_2012.cif"
  abstract: "In order for molecular magnetic materials to become functional, they must retain their magnetization at reasonable temperatures implying high energy barriers for spin reversal. The field of single-molecule magnets (SMMs) has recently experienced an explosion of research targeting these high anisotropic barriers. Achieving such feats has involved increasing the spin of a complex and/or increasing the inherent magnetic anisotropy. Exerting control over the total spin of a complex has been possible contrary to controlling the global anisotropy. Herein, we report the experimental and theoretical study of local anisotropy alignment on Dy<sup>III</sup> metal centers and their orientation relative to other centers in rare, dinuclear quadruply-stranded helicate/mesocate complexes. A detailed study of these supramolecular architectures has advanced our knowledge of the origins of magnetic relaxation in SMMs which was shown to arise from minute changes in bond distances around the metal centers leading to changes in the local anisotropy and, in turn, the effective energy barriers."
  image: "assets/publications/2012/Habib_CS_2012.png"

