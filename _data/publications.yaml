    si: "assets/publications/2015/Holmberg_DT_2015_SI.pdf"
    cif: "assets/publications/2015/Holmberg_DT_2015.cif"
  abstract: "A Gadolinium EDTA chelate displays characteristic isotropic behaviour common of Gd<sup>III</sup> complexes under zero applied magnetic field, and anisotropic behaviour arising from dipolar coupling and weak spin–phonon coupling under an applied magnetic field. This surprising magnetic behaviour for Gd<sup>III</sup> is investigated using SQUID magnetometry and rationalized through theoretical calculations."
