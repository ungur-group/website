    cif: "assets/publications/2014/LeRoy_JACS_2014.cif"
  abstract: "Two different coupling strategies were employed to create Er<sup>III</sup> single-molecule magnets (SMMs) using high blocking temperature mononuclear precursors. The magnetic properties of three lanthanide–COT complexes, [Er<sup>III</sup><sub>2</sub>(COT″)<sub>3</sub>] (<b>1</b>) (COT″ = 1,4-bis(trimethylsilyl)cyclooctatetraenyl dianion) and K<sub>2</sub>(THF)<sub>4</sub>[Ln<sup>III</sup><sub>2</sub>(COT)<sub>4</sub>] (Ln = Gd (<b>2</b>), Er (<b>3</b>); THF = tetrahydrofuran, COT = cyclooctatetraenyl dianion), are reported. Both Er<sup>III</sup> complexes behave as SMMs and exhibit magnetic hysteresis at 12 K in solid state. In solution compound <b>1</b> exhibits hysteresis up to 14 K. Ac susceptibility data indicates a 100 s blocking temperature of 12.5 and 12.9 K for [Er<sup>III</sup><sub>2</sub>(COT″)<sub>3</sub>] and K<sub>2</sub>(THF)<sub>4</sub>[Er<sup>III</sup><sub>2</sub>(COT)<sub>4</sub>], respectively. Both Er<sup>III</sup> dimers display enhanced SMM properties over their mononuclear analogues due to their linear structure and strictly axial anisotropy. A 4 K increase in the magnetic blocking temperature of [Er<sup>III</sup><sub>2</sub>(COT″)<sub>3</sub>] over the double-decker analogue is attributed to an additional mechanism of magnetization blocking arising from exchange coupling between Er<sup>III</sup> ions."
  image: "assets/publications/2014/LeRoy_JACS_2014.png"

- title: An NCN-pincer ligand dysprosium single-ion magnet showing magnetic relaxation via the second excited state
  authors:
    - Y. N. Guo
    - L. Ungur
    - G. E. Granroth
    - A. K. Powell
    - C. Wu
    - S. E. Nagler
    - J. Tang
    - L. F. Chibotaru
    - D. Cui
  group_members:
