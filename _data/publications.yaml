    si: "assets/publications/2014/Langley_IC_2014_SI.pdf"
    cif: "assets/publications/2014/Langley_IC_2014.cif"
  abstract: "The synthesis and structural characterization of four related heterometallic complexes of formulas [Dy<sup>III</sup><sub>2</sub>Co<sup>III</sup><sub>2</sub>(OMe)<sub>2</sub>(teaH)<sub>2</sub>(O<sub>2</sub>CPh)<sub>4</sub>(MeOH)<sub>4</sub>](NO<sub>3</sub>)<sub>2</sub>·MeOH·H<sub>2</sub>O (<b>1a</b>) and [Dy<sup>III</sup><sub>2</sub>Co<sup>III</sup><sub>2</sub>(OMe)<sub>2</sub>(teaH)<sub>2</sub>(O<sub>2</sub>CPh)<sub>4</sub>(MeOH)<sub>2</sub>(NO<sub>3</sub>)<sub>2</sub>]·MeOH·H<sub>2</sub>O (<b>1b</b>), [Dy<sup>III</sup><sub>2</sub>Co<sup>III</sup><sub>2</sub>(OMe)<sub>2</sub>(dea)<sub>2</sub>(O<sub>2</sub>CPh)<sub>4</sub>(MeOH)<sub>4</sub>](NO<sub>3</sub>)<sub>2</sub> (<b>2</b>), [Dy<sup>III</sup><sub>2</sub>Co<sup>III</sup><sub>2</sub>(OMe)<sub>2</sub>(mdea)<sub>2</sub>(O<sub>2</sub>CPh)<sub>4</sub>(NO<sub>3</sub>)<sub>2</sub>] (<b>3</b>), and [Dy<sup>III</sup><sub>2</sub>Co<sup>III</sup><sub>2</sub>(OMe)<sub>2</sub>(bdea)<sub>2</sub>(O<sub>2</sub>CPh)<sub>4</sub>(MeOH)<sub>4</sub>](NO<sub>3</sub>)<sub>2</sub>·0.5MeOH·H<sub>2</sub>O (<b>4a</b>) and [Dy<sup>III</sup><sub>2</sub>Co<sup>III</sup><sub>2</sub>(OMe)<sub>2</sub>(bdea)<sub>2</sub>(O<sub>2</sub>CPh)<sub>4</sub>(MeOH)<sub>2</sub>(NO<sub>3</sub>)<sub>2</sub>]·MeOH·1.5H<sub>2</sub>O (<b>4b</b>) are reported (teaH<sub>3</sub> = triethanolamine, deaH<sub>2</sub> = diethanolamine, mdeaH<sub>2</sub> = N-methyldiethanolamine, and bdeaH<sub>2</sub> = N-n-butyldiethanolamine). Compounds <b>1</b> (≡ <b>1a</b> and <b>1b</b>) and <b>4</b> (≡ <b>4a</b> and <b>4b</b>) both display two unique molecules within the same crystal and all compounds display a butterfly type core, with the Dy<sup>III</sup> ions occupying the central body positions and the diamagnetic Co<sup>III</sup> ions the outer wing-tip sites. Compounds <b>1</b>–<b>4</b> were investigated via direct current and alternating current magnetic susceptibility measurements, and it was found that each complex displayed single-molecule magnet (SMM) behavior. All four compounds display unique coordination and geometric environments around the Dy<sup>III</sup> ions and it was found that each displays a different anisotropy barrier. <i>Ab initio</i> calculations were performed on <b>1</b>–<b>4</b> and these determined the low lying electronic structure of each Dy<sup>III</sup> ion and the magnetic interactions for each cluster. It was found that there was a strong correlation between the calculated energy gap between the ground and first excited states of the single-ion ligand-field split Dy<sup>III</sup> levels and the experimentally observed anisotropy barrier. Furthermore, the transverse <i>g</i> factors found for the Dy<sup>III</sup> ions, defining the tunnelling rates within the ground Kramers doublets, are largest for <b>1</b>, which agrees with the experimental observation of the shortest relaxation time in the high-temperature domain for this complex. The magnetic exchange between the Dy<sup>III</sup> ions revealed overall antiferromagnetic interactions for each compound, derived from the dominant dipolar exchange resulting in nonmagnetic ground states for <b>1</b>–<b>4</b>. The diamagnetic ground states coupled with small tunneling gaps resulted in quantum tunneling time scales at zero field of between 0.1 and >1.5 s."
  image: "assets/publications/2014/Langley_IC_2014.png"

