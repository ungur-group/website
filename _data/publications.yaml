- title: "Exchange Interactions Switch Tunneling: A Comparative Experimental and Theoretical Study on Relaxation Dynamics by Targeted Metal Ion Replacement"
  authors:
    - H. Tian
    - L. Ungur
    - L. Zhao
    - S. Ding
    - J. Tang
    - L. F. Chibotaru
  group_members:
    - L. Ungur
  year: "2018"
  journal: Chemistry – A European Journal
  links:
    doi: 10.1002/chem.201801523
    pdf: "assets/publications/2018/Tian_CEJ_2018.pdf"
    si: "assets/publications/2018/Tian_CEJ_2018_SI.pdf"
    cif: "assets/publications/2018/Tian_CEJ_2018.cif"
  abstract: "The magnetic relaxation and magnetization blocking barriers of tailor-made homo- and heterodinuclear compounds [Dy<sub>2</sub>(opch)<sub>2</sub>(OAc)<sub>2</sub>(H<sub>2</sub>O)<sub>2</sub>]⋅MeOH (<b>1</b>) and [DyMn(opch)<sub>2</sub>(OAc)(MeOH)(H<sub>2</sub>O)<sub>2</sub>] (<b>2</b>), where H<sub>2</sub>opch is (E)-N′-(2-hydroxy-3-methoxybenzylidene)pyrazine-2-carbohydrazide, were systematically investigated and the change in single-molecule magnet behavior originating from targeted replacement of one dysprosium site in the Dy<sub>2</sub> compound with manganese was elucidated through a combination of experimental and theoretical studies. A detailed comparative study on these closely related model compounds revealed remarkable changes of the crystal-field splitting and anisotropy of the Dy site and the total exchange spectrum due to the replacement of Dy by Mn. The blocking barriers of these two compounds, which explain their different relaxation behaviors, were analyzed. The two Ising doublets arising from the magnetic interaction in the case of <b>1</b> are strongly uniaxial, with tunneling splittings smaller than 10<sup>-6</sup> cm<sup>-1</sup>, and this leads to magnetic relaxation at temperatures exceeding the exchange energy (2.14 cm<sup>-1</sup>), which involves transition via the excited states corresponding to local transitions on the excited doublet at the Dy site. The third and fourth exchange doublets in <b>2</b> (located at 2.16 and 3.25 cm<sup>-1</sup>, respectively) show much larger tunneling splittings (of 10<sup>-4</sup> and 10<sup>-3</sup> cm<sup>-1</sup>, respectively), and thus open an important path for magnetic relaxation."
  image: "assets/publications/2018/Tian_CEJ_2018.png"

