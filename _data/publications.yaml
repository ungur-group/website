  journal: Chemistry – A European Journal
  links:
    doi: 10.1002/chem.202001365
    pdf: "assets/publications/2020/Yamashita_CEJ_2020.pdf"
    si: "assets/publications/2020/Yamashita_CEJ_2020_SI.pdf"
  abstract: "Presented here is a comprehensive study of highly oxidized multiple-decker complexes composed of Tb<sup>III</sup> and Cd<sup>II</sup> ions and two to five phthalocyaninato ligands, which are stabilized by electron-donating n-butoxy groups. From X-ray structural analyses, all the complexes become axially compressed upon ligand oxidation, resulting in bowl-shaped distortions of the ligands. In addition, unusual coexistence of square antiprism and square prism geometries around metal ions was observed in +4e charged species. From paramagnetic <sup>1</sup>H NMR studies on the resulting series of triple, quadruple and quintuple-decker complexes, ligand oxidation leads to a decrease in the magnetic anisotropy, as predicted from theoretical calculations. Unusual paramagnetic shifts were observed in the spectra of the +2e charged quadruple and quintuple-decker complexes, indicating that those two species are actually unexpected triplet biradicals. Magnetic measurements revealed that the series of complexes show single-molecule magnet properties, which are controlled by the multi-step redox induced structural changes."
  image: "assets/publications/2020/Yamashita_CEJ_2020.png"

- title: Deriving the vibronic coupling constants of the cyclopentadienyl radical with density functional theory and <i>G</i> <i>W</i>
  authors:
    - Z. C. Wong
    - L. Ungur
  group_members:
    - L. Ungur
  year: "2020"
  journal: The Journal of Chemical Physics
  links:
    doi: 10.1063/5.0014753
    pdf: "assets/publications/2020/Wong_JCP_2020.pdf"
    si: "assets/publications/2020/Wong_JCP_2020_SI.pdf"
  abstract: "The vibronic coupling constants of the cyclopentadienyl radical have been calculated with G<sub>0</sub>W<sub>0</sub>, HF, and density functional theory (DFT) with various exchange-correlation functionals such as PBE, PBE0, LC-ωPBE, and the non-empirically tuned LC-ωPBE∗. The vibronic coupling constants for HF and DFT were derived using the gradients of the eigenvalues of the degenerate HOMOs of the closed-shell cyclopentadienyl anion, while the gradients of the corresponding quasiparticle energy levels were used in the case of G<sub>0</sub>W<sub>0</sub>. The differences between the linear vibronic constants obtained using HF and DFT were found to be small and reduced further when the G<sub>0</sub>W<sub>0</sub> correction is applied to HF and DFT. Finally, the linear vibronic coupling constants calculated with G<sub>0</sub>W<sub>0</sub> were found to agree well with the values obtained using high level wave function methods in the literature, which suggests that G<sub>0</sub>W<sub>0</sub> can be a useful tool toward the study of vibronic coupling."
  image: "assets/publications/2020/Wong_JCP_2020.png"

- title: Multiresponsive Spin Crossover Driven by Rotation of Tetraphenylborate Anion in an Iron(III) Complex
  authors:
    - S. G. Wu
    - M. N. Hoque
    - J. Y. Zheng
    - G. Z. Huang
    - N. V. Ha Anh
    - L. Ungur
    - W. X. Zhang
