- title: Toroidal magnetic moments in Tb<sub>4</sub> squares
  authors:
    - Q. Yang
    - L. Ungur
    - W. Wernsdorfer
    - J. Tang
  group_members:
    - L. Ungur
  year: "2022"
  journal: Inorganic Chemistry Frontiers
  links:
    doi: 10.1039/D1QI01459E
    pdf: "assets/publications/2022/Yang_ICF_2022.pdf"
    si: "assets/publications/2022/Yang_ICF_2022_SI.pdf"
    cif: "assets/publications/2022/Yang_ICF_2022.cif"
  abstract: "Terbium-based complexes are passable in the study of single molecule toroics (SMTs). Herein, the syntheses and characterizations of a series of Tb<sub>4</sub> SMTs isolated from reduced or dimerized Schiff base ligands are presented. These complexes share a similar μ<sub>4</sub>-O bridged Tb<sub>4</sub> square core and show diamagnetic ground states. Micro-SQUID technique was carried out on a single-crystal sample and the results suggest that there is a toroidal arrangement of the magnetic moments. Ab initio calculations are performed on these complexes and confirm the mixed-moment SMT properties. This allowed us to access a new strategy for generating single molecule toroics in terbium-based molecules."
  image: "assets/publications/2022/Yang_ICF_2022.png"

