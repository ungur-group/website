    pdf: "assets/publications/2011/Langley_CEJ_2011.pdf"
    si: "assets/publications/2011/Langley_CEJ_2011_SI.pdf"
    cif: "assets/publications/2011/Langley_CEJ_2011.cif"
  abstract: "Synthesis, crystal structures and magnetic studies are reported for four new heterometallic Cu<sup>II</sup>–Ln<sup>III</sup> clusters. The reaction of Cu(NO<sub>3</sub>)<sub>2</sub>·3H<sub>2</sub>O with triethanolamine (teaH<sub>3</sub>), pivalic acid, triethylamine and Ln(NO<sub>3</sub>)<sub>3</sub>·6H<sub>2</sub>O (Ln=Gd, Tb, Dy and Ho) results in the formation of four isostructural nonanuclear complexes of general formula [Cu<sup>II</sup><sub>5</sub>Ln<sup>III</sup><sub>4</sub>O<sub>2</sub>(teaH)<sub>4</sub>{O<sub>2</sub>CC(CH<sub>3</sub>)<sub>3</sub>}<sub>2</sub>(NO<sub>3</sub>)<sub>4</sub>(OMe)<sub>4</sub>]·2MeOH·2Et<sub>2</sub>O [Ln=Gd (<b>1</b>), Tb (<b>2</b>), Dy (<b>3</b>) and Ho (<b>4</b>)]. The metal core of each cluster is made up of four face- and vertex-sharing tetrahedral units. Solid-state DC magnetic susceptibility studies reveal competing anti- and ferromagnetic interactions within each cluster leading to large-spin ground states for <b>1</b>–<b>4</b>. Solid-state AC magnetic susceptibility studies show frequency-dependent out-of-phase <i>χ</i>''<sub>M</sub> signals for <b>2</b>–<b>4</b> below 4 K, suggestive of single-molecule magnet behaviour. <i>Ab initio</i> calculations on one of the anisotropic examples (<b>3</b>) provided a rare set of <i>J</i> values for Dy–Cu and Cu–Cu exchange interactions (Dy–Dy zero), some ferro- and some antiferromagnetic in character, that explain its magnetic behaviour."
  image: "assets/publications/2011/Langley_CEJ_2011.png"

