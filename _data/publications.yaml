    cif: "assets/publications/2017/Chen_CEJ_2017.cif"
  abstract: "The pentagonal bipyramidal single-ion magnets (SIMs) are among the most attractive prototypes of high-performance single-molecule magnets (SMMs). Here, a fluorescence-active phosphine oxide ligand CyPh<sub>2</sub>PO (=cyclohexyl(diphenyl)phosphine oxide) was introduced into [Dy(CyPh<sub>2</sub>PO)<sub>2</sub>(H<sub>2</sub>O)<sub>5</sub>]Br<sub>3</sub>⋅2(CyPh<sub>2</sub>PO)⋅EtOH⋅3H<sub>2</sub>O, and combined dynamic magnetic measurement, optical characterization, ab initio calculation, and magneto-optical correlation of this high-performance pseudo-D5h Dy<sup>III</sup> SIM with large <i>U</i><sub>eff</sub> (508(2) K) and high magnetic hysteresis temperature (19 K) were performed. This work provides a deeper insight into the rational design of promising molecular magnets."
