  year: "2021"
  journal: Angewandte Chemie International Edition
  links:
    doi: 10.1002/anie.202112764
    pdf: "assets/publications/2021/Liu_Angew_2021.pdf"
    si: "assets/publications/2021/Liu_Angew_2021_SI.pdf"
    cif: "assets/publications/2021/Liu_Angew_2021.cif"
  abstract: "Here we reported the deuteration of the metal-binding equatorial water molecules in a reported Ho<sup>III</sup> single-molecule magnet (SMM) with pentagonal-bipyramidal geometry, from [Ho(CyPh<sub>2</sub>PO)<sub>2</sub>(H<sub>2</sub>O)<sub>5</sub>]<sup>3+</sup> to [Ho(CyPh<sub>2</sub>PO)<sub>2</sub>(D<sub>2</sub>O)<sub>5</sub>]<sup>3+</sup>. The hyperfine structures originating from the nuclear spin of <sup>165</sup>Ho<sup>III</sup> can be clearly observed. Moreover, the resulting magnetization dynamics revealed the switch of the relative relaxation rates for the two isotope-isomorphic complexes—respectively faster/slower at low/high temperature. The noticeable isotope effect arises from not only the paramagnetic metal center but also the diamagnetic ligands, which can be explained by the ab initio calculated tunnel splitting and the involvement of the super-hyperfine interaction related to the difference in the nuclear spin number of protium (<sup>1</sup>H, <i>I</i> = 1/2) and deuterium (<sup>2</sup>H, <i>I</i> = 1)."
