<header class="site-header" role="banner">
  <div class="site-brand">
    <a class="site-logo-link" rel="author" href="{{ "/" | relative_url }}">
      <img
        class="site-logo"
        src="{{ '/assets/logo/coloured.svg' | relative_url }}"
        alt="Ungur Group logo">
      <img
        class="site-logo site-logo--invert"
        src="{{ '/assets/logo/digital_white.svg' | relative_url }}"
        alt="Ungur Group logo">
    </a>
    <div class="site-title-block">
      <span class="site-name">Ungur Group</span>
      <span class="site-divider" aria-hidden="true"></span>
      <span class="site-sub">NUS</span>
    </div>
  </div>
  <button
    class="nav-toggle"
    id="nav-toggle"
    aria-label="Menu"
    aria-controls="site-nav"
    aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="nav-backdrop" id="nav-backdrop" aria-hidden="true"></div>

  <nav class="site-nav" id="site-nav" aria-label="Main">
    <div class="nav-links">
    <button
      class="theme-toggle"
      id="theme-toggle"
      aria-label="Toggle theme"
      title="Toggle theme">
      <!-- Moon icon (shown in light mode) -->
      <svg
        class="moon-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>

      <!-- Sun icon (shown in dark mode) -->
      <svg
        class="sun-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <circle
          cx="12"
          cy="12"
          r="5"></circle>
        <line
          x1="12"
          y1="1"
          x2="12"
          y2="3"></line>
        <line
          x1="12"
          y1="21"
          x2="12"
          y2="23"></line>
        <line
          x1="4.22"
          y1="4.22"
          x2="5.64"
          y2="5.64"></line>
        <line
          x1="18.36"
          y1="18.36"
          x2="19.78"
          y2="19.78"></line>
        <line
          x1="1"
          y1="12"
          x2="3"
          y2="12"></line>
        <line
          x1="21"
          y1="12"
          x2="23"
          y2="12"></line>
        <line
          x1="4.22"
          y1="19.78"
          x2="5.64"
          y2="18.36"></line>
        <line
          x1="18.36"
          y1="5.64"
          x2="19.78"
          y2="4.22"></line>
      </svg>
    </button>

    {% for item in site.data.navigation %}
      <a class="page-link {% if page.url == item.link %}active{% endif %}" href="{{ item.link | relative_url }}">{{ item.name }}</a>
    {% endfor %}
    </div>
  </nav>
</header>
